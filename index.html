  color-scheme:dark; } }
:root[data-theme="dark"]{

  --accent:#5DB592; --accent-ink:#0E1411; --accent-soft:#1D3229;

*{box-sizing:border-box}

.stmt .l a:hover,.linkbtn:hover{text-decoration-color:var(--accent)}
.amt{text-align:right;white-space:nowrap}

.alerts{display:grid;gap:8px}

.alert.rojo .ic{background:var(--bad-bg);color:var(--bad)} .alert.amarillo .ic{background:var(--warn-bg);color:var(--warn)} .alert.info .ic{background:var(--info-bg);color:var(--info)}
.alert b{font-size:14px} .alert span{font-size:13.5px;color:var(--muted)}
/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

tr:last-child td{border-bottom:0}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}

.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}

.parties{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.party{border-bottom:1px solid var(--line)} .party:last-child{border-bottom:0}
.party>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;cursor:pointer}
.party>summary::-webkit-details-marker{display:none}
.party>summary:hover{background:var(--sunk)}
.party .nm{font-weight:700;overflow-wrap:anywhere}
.party .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

.mail{font-size:12px;color:var(--muted);padding:8px 0 0;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.chart{width:100%;height:auto;display:block;overflow:visible}

.note{font-size:13px;color:var(--muted);max-width:75ch}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}

.hide-sm{} @media (max-width:620px){.hide-sm{display:none}}

.stmt .l.st.big{font-size:15.5px;border-bottom:2px solid var(--ink);padding-block:10px}

header.top{background:var(--bg);border-bottom:0}

.page-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}

.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(16,32,24,.05)}

      fl.dias.map(function (d) { return '\x3ctr>\x3ctd style="white-space:nowrap">' + F(d.f, true).replace(/ \d{4}$/, '') + '\x3c/td>\x3ctd class="r">' + M(d.ini) + '\x3c/td>\x3ctd class="r">' + M(d.rec) + '\x3c/td>\x3ctd class="r">' + M(d.prov) + '\x3c/td>\x3ctd class="r">' + M(d.serv) + '\x3c/td>\x3ctd class="r">' + M(d.pers) + '\x3c/td>\x3ctd class="r">' + M(d.imp) + '\x3c/td>\x3ctd class="r">' + M(d.gast) + '\x3c/td>\x3ctd class="r">\x3cb>' + amt(d.fin) + '\x3c/b>\x3c/td>\x3ctd class="r">' + amt(d.sobre) + '\x3c/td>\x3ctd>' + chip(d.sem, SEM[d.sem][1]) + '\x3c/td>\x3c/tr>'; }).join('') +
      '\x3c/tbody>\x3c/table>\x3c/div>\x3cp class="note">El primer día absorbe todo lo vencido y lo programado hasta esa fecha; por eso suele ser el día más apretado. MEGAMAS se cuenta como disponible; las otras cuentas por cobrar no, hasta que se cobren.\x3c/p>\x3c/section>';
    return h;
  }
  function lineFlujo(fl) {
    var w = CW(), hh = 250, pl = 62, pr = 64, pt = 14, pb = 26;
    var vals = fl.dias.map(function (d) { return d.fin; }).concat([fl.caja, fl.reserva, 0]);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var st = nice((hi - lo) / 4); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
    function X(i) { return pl + (w - pl - pr) * i / 14; } function Y(v) { return pt + (hh - pt - pb) * (hi - v) / (hi - lo || 1); }
    var s = '\x3csvg class="chart" viewBox="0 0 ' + w + ' ' + hh + '" role="img" aria-label="Saldo proyectado a 14 días">';
    for (var v = lo; v <= hi + 1; v += st) s += '\x3cline class="grid" x1="' + pl + '" x2="' + (w - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>\x3ctext x="' + (pl - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + mm(v) + '\x3c/text>';
    if (lo < 0) s += '\x3cline class="zero" x1="' + pl + '" x2="' + (w - pr) + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/>';
    var pts = [[X(0), Y(fl.caja)]].concat(fl.dias.map(function (d, i) { return [X(i + 1), Y(d.fin)]; }));
    var base = Y(Math.max(lo, 0));
    s += '\x3cpath d="M' + pts[0][0] + ',' + base + ' L' + pts.map(function (p) { return p.join(','); }).join(' L') + ' L' + pts[pts.length - 1][0] + ',' + base + 'Z" fill="var(--s1)" opacity=".12"/>';
    s += '\x3cpolyline points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>';
    s += '\x3cline x1="' + pl + '" x2="' + (w - pr) + '" y1="' + Y(fl.reserva) + '" y2="' + Y(fl.reserva) + '" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 4"/>\x3ctext x="' + (w - pr + 4) + '" y="' + (Y(fl.reserva) + 4) + '">Reserva\x3c/text>';
    fl.dias.forEach(function (d, i) {

      s += '\x3ccircle cx="' + X(i + 1) + '" cy="' + Y(d.fin) + '" r="4.5" fill="' + col + '" stroke="var(--surface)" stroke-width="2"/>';
      s += '\x3crect x="' + (X(i + 1) - 18) + '" y="' + pt + '" width="36" height="' + (hh - pt - pb) + '" fill="transparent" data-tip="' + esc(F(d.f, true) + '\nSaldo final: ' + M(d.fin) + '\nSalidas: ' + M(d.sal) + '\nEstado: ' + SEM[d.sem][1]) + '"/>';
      if (i % 2 === 0) s += '\x3ctext x="' + X(i + 1) + '" y="' + (hh - 8) + '" text-anchor="middle">' + F(d.f) + '\x3c/text>';
    });
    var last = pts[pts.length - 1];
    s += '\x3ctext x="' + (last[0] + 8) + '" y="' + (last[1] + 4) + '" style="fill:var(--ink);font-weight:700">' + mm(fl.dias[13].fin) + '\x3c/text>';
    s += '\x3ctext x="' + X(0) + '" y="' + (hh - 8) + '" text-anchor="middle">Hoy\x3c/text>';
    return s + '\x3c/svg>';
  }

  /* ---------- Eventos ---------- */
  function bind() {
    root.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
    root.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { go(b.dataset.go); }; });
    root.querySelectorAll('[data-seg]').forEach(function (b) { b.onclick = function () { S[b.dataset.seg] = b.dataset.v; render(); }; });
    root.querySelectorAll('[data-est]').forEach(function (b) { b.onclick = function () { S.est = S.est === b.dataset.est ? 'pend' : b.dataset.est; render(); }; });
    root.querySelectorAll('details.party').forEach(function (d) { d.ontoggle = function () { S.open[d.dataset.k] = d.open; }; });
    var din = document.getElementById('d-in');
    din.onchange = function () { if (din.value) { S.D = fromIso(din.value); render(); } };
    document.getElementById('d-prev').onclick = function () { S.D--; render(); };
    document.getElementById('d-next').onclick = function () { S.D++; render(); };
    var q = document.getElementById('q');
    if (q) q.oninput = function () { S.q = q.value; var pos = q.selectionStart; render(); var n = document.getElementById('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
    var fi = document.getElementById('file-in'); fi.onchange = function () { if (fi.files[0]) load(fi.files[0]); };
    var sv = document.getElementById('save'); if (sv) sv.onclick = save;
    var dc = document.getElementById('discard'); if (dc) dc.onclick = function () { W = SAVED; pending = null; S.D = W.fechaInforme; render(); };
    var ex = document.getElementById('err-x'); if (ex) ex.onclick = function () { S.err = null; render(); };
    var rec = document.getElementById('in-rec'); if (rec) rec.onchange = function () { S.recaudo = MXnum(rec.value); render(); };
    var res = document.getElementById('in-res'); if (res) res.onchange = function () { S.reserva = MXnum(res.value); render(); };
    var rs = document.getElementById('reset-sim'); if (rs) rs.onclick = function () { S.recaudo = S.reserva = null; render(); };
    var tip = document.getElementById('tip');
    root.querySelectorAll('[data-tip]').forEach(function (el) {
      el.onmousemove = function (e) { tip.hidden = false; tip.innerText = el.getAttribute('data-tip'); var x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };
      el.onmouseleave = function () { tip.hidden = true; };
      el.onclick = function (e) { el.onmousemove(e); };
    });
  }
  function MXnum(v) { var n = parseFloat(String(v).replace(/[^\d\-]/g, '')); return isFinite(n) ? n : null; }
  function go(t) { S.tab = t; try { localStorage.setItem('mx-tab', t); } catch (e) {} window.scrollTo(0, 0); render(); }

  /* ---------- Cargar Excel ---------- */
  function load(file) {
    if (!window.XLSX) { S.err = 'No se pudo cargar el lector de Excel. Revise la conexión e intente de nuevo.'; render(); return; }
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
        var need = ['BANCOS', 'PROVEEDORES', 'SERVICIOS', 'PERSONAL', 'GASTOS_VARIOS', 'INGRESOS', 'CUENTAS_POR_COBRAR', 'DISPONIBLE REAL'];
        var miss = need.filter(function (n) { return !wb.Sheets[n]; });
        if (miss.length) throw new Error('Al archivo le faltan las hojas: ' + miss.join(', ') + '. Cargue el Excel de Tesorería Integrada.');
        var get = function (s, a) { var ws = wb.Sheets[s]; if (!ws) return undefined; var c = ws[a]; return c ? c.v : undefined; };

      } catch (e) { S.err = e.message || 'No se pudo leer el archivo.'; render(); }
    };
    fr.onerror = function () { S.err = 'No se pudo leer el archivo.'; render(); };
    fr.readAsArrayBuffer(file);
  }
  function save() {
    if (!artifactNS) return;
    var b = document.getElementById('save'); b.disabled = true; b.textContent = 'Guardando…';
    artifactNS.publish(artifactNS.web ? null : buildDoc(W)).then(function () { if (artifactNS.web) { SAVED = W; pending = null; S.err = null; render(); } }).catch(function (e) {
      var c = e && e.code;
      S.err = c === 'conflict' ? 'Alguien guardó otra versión al mismo tiempo. La página se recargará con esa versión; cargue el Excel de nuevo si hace falta.' : (c === 'not_writer' || c === 'not_granted' || c === 'permission-denied') ? 'Su cuenta no tiene permiso para guardar cambios en esta página.' : 'No se pudo guardar: ' + (e && e.message || 'error desconocido');
      render();

  }
  function buildDoc(data) {
    var reset = '*,*::before,*::after{box-sizing:border-box}';
    var head = '\x3c!doctype html>\x3chtml>\x3chead>\x3cmeta charset=utf8>\x3cmeta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">\x3cstyle>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}\x3c/style>\x3c/head>\x3cbody>';
    var json = JSON.stringify(data).replace(/\x3c/g, '\\u003c');
    return head + '\x3ctitle>Flujo de Caja La Matriarca\x3c/title>' +
      '\x3cstyle id="mx-style">' + document.getElementById('mx-style').textContent + '\x3c/style>' +
      document.getElementById('mx-fonts').outerHTML +
      '\x3cdiv id="app">\x3c/div>' +
      '\x3cscript type="application/json" id="mx-data">' + json + '<\/script>' +
      '\x3cscript src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>' +
      '\x3cscript id="mx-engine">' + document.getElementById('mx-engine').textContent + '<\/script>' +
      '\x3cscript id="mx-app">' + document.getElementById('mx-app').textContent + '<\/script>' +
      '\x3c/body>\x3c/html>';

  render();
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script id="mx-engine">/* Motor de flujo de caja La Matriarca: lee el Excel "Tesorería Integrada" y replica sus cálculos. */
var MX = (function () {
  function colIdx(L) { var n = 0; for (var i = 0; i < L.length; i++) n = n * 26 + (L.charCodeAt(i) - 64); return n; }
  function colName(n) { var s = ''; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function num(v) { if (typeof v === 'number' && isFinite(v)) return v; if (typeof v === 'string') { var t = v.replace(/[$\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'); var n = parseFloat(t); return isFinite(n) ? n : 0; } return 0; }
  function str(v) { return v == null ? '' : String(v).trim(); }
  function dte(v) {
    if (typeof v === 'number' && v > 20000 && v < 80000) return Math.floor(v);

      if (m) { var y = +m[3]; if (y < 100) y += 2000; return Math.round((Date.UTC(y, +m[2] - 1, +m[1]) - Date.UTC(1899, 11, 30)) / 864e5); }

  }
  function eq(a, b) { return str(a).toLowerCase() === str(b).toLowerCase(); }

  // get(sheet, "A1") -> valor en caché; maxRow(sheet)
  function parse(get, maxRow) {
    var W = {};
    function rows(sheet, from, to, fn) { var mr = Math.min(to, maxRow(sheet) || to); for (var r = from; r <= mr; r++) fn(function (L) { return get(sheet, L + r); }, r); }
    // Cuentas
    var accounts = [];
    for (var r = 7; r <= 16; r++) { var n = str(get('BANCOS', 'A' + r)); if (n) accounts.push({ name: n, type: str(get('BANCOS', 'B' + r)) || 'Banco', ini: num(get('BANCOS', 'C' + r)) }); }
    W.accounts = accounts;
    W.inicio = dte(get('BANCOS', 'B2'));
    W.transfers = [];
    rows('BANCOS', 34, 101, function (g) { var f = dte(g('A')); var v = num(g('D')); if (f && v) W.transfers.push({ f: f, de: str(g('B')), a: str(g('C')), v: v, obs: str(g('E')) }); });
    // Saldos reales (fila 107 encabezados)
    var hdr = [];
    for (var c = 2; c <= 12; c++) { var h = str(get('BANCOS', colName(c) + '107')); if (!h) break; hdr.push({ col: colName(c), name: h.replace(/\s*\(auto\)\s*/i, '').trim(), auto: /\(auto\)/i.test(h) }); }
    W.realCols = hdr.map(function (h) { return { name: h.name, auto: h.auto }; });
    W.real = [];
    rows('BANCOS', 108, 400, function (g) { var f = dte(g('A')); if (!f) return; W.real.push({ f: f, v: hdr.map(function (h) { return num(g(h.col)); }) }); });
    // Anexos de pagos
    W.pay = [];
    function pushPay(o) { if (!o.tercero && !o.valor && !o.pagado) return; W.pay.push(o); }
    rows('PROVEEDORES', 5, 5000, function (g, r) { pushPay({ cat: 'prov', row: r, fDoc: dte(g('A')), fProg: dte(g('B')), fPago: dte(g('C')), tercero: str(g('D')), nit: str(g('E')), factura: str(g('I')), concepto: str(g('J')), sub: str(g('L')), tipo: str(g('K')), valor: num(g('S')), pagado: num(g('T')), banco: str(g('U')), obs: str(g('V')), punto: str(g('W')), saldo: num(g('X')) }); });
    rows('SERVICIOS', 5, 5000, function (g, r) { pushPay({ cat: 'serv', row: r, fDoc: dte(g('A')), fProg: dte(g('B')), fPago: dte(g('C')), tercero: str(g('E')), sub: str(g('D')), concepto: str(g('F')), venc: dte(g('G')), banco: str(g('H')), valor: num(g('O')), pagado: num(g('P')), obs: str(g('Q')), factura: str(g('R')), punto: str(g('S')), saldo: num(g('T')) }); });
    rows('PERSONAL', 5, 5000, function (g, r) { pushPay({ cat: 'pers', row: r, fProg: dte(g('A')), fPago: dte(g('B')), sub: str(g('C')), tercero: str(g('D')), concepto: str(g('F')), factura: str(g('G')), banco: str(g('H')), valor: num(g('I')), pagado: num(g('J')), obs: str(g('K')), punto: str(g('L')), saldo: num(g('M')) }); });
    rows('GASTOS_VARIOS', 5, 5000, function (g, r) { pushPay({ cat: 'gast', row: r, fProg: dte(g('A')), fPago: dte(g('B')), sub: str(g('C')), tercero: str(g('D')), concepto: str(g('E')), factura: str(g('F')), banco: str(g('G')), valor: num(g('H')), pagado: num(g('I')), obs: str(g('J')), punto: str(g('K')), saldo: num(g('L')) }); });
    W.pay.forEach(function (p) { if (!p.fDoc) p.fDoc = p.fProg || p.fPago; });
    // Ingresos
    W.ing = [];
    // Columnas opcionales en INGRESOS (fila 4): "ICO"/"Impoconsumo", "Propina", "Venta neta"
    var optIco = null, optProp = null, optNeta = null;
    for (var oc = 10; oc <= 30; oc++) { var oh = str(get('INGRESOS', colName(oc) + '4')).toLowerCase(); if (!oh) continue; if (/propina/.test(oh)) optProp = colName(oc); else if (/neta|base|sin imp/.test(oh)) optNeta = colName(oc); else if (/\bico\b|impoconsumo|impuesto/.test(oh)) optIco = colName(oc); }
    W.ingCols = { ico: !!optIco, prop: !!optProp, neta: !!optNeta };
    rows('INGRESOS', 5, 5000, function (g) { var f = dte(g('A')); var v = num(g('G')); if (!f || !v) return; var o = { f: f, tipo: str(g('B')), cliente: str(g('C')), desc: str(g('D')), medio: str(g('E')), banco: str(g('F')), v: v, obs: str(g('H')), punto: str(g('I')) };
      if (optIco) o.ico = num(g(optIco)); if (optProp) o.prop = num(g(optProp)); if (optNeta) o.neta = num(g(optNeta)); W.ing.push(o); });
    // CxC manual
    W.cxc = [];
    rows('CXC', 3, 400, function (g) { var f = dte(g('A')); if (!f) return; W.cxc.push({ f: f, emp: num(g('B')), soc: num(g('C')), otr: num(g('D')) }); });
    // MEGAMAS
    W.megaIni = num(get('CUENTAS_POR_COBRAR', 'E3'));
    W.mega = [];
    rows('CUENTAS_POR_COBRAR', 5, 3000, function (g) { var f = dte(g('A')); var v = num(g('H')); if (!f || !v) return; W.mega.push({ f: f, ent: str(g('B')), tipo: str(g('C')), benef: str(g('D')), factura: str(g('E')), concepto: str(g('F')), banco: str(g('G')), v: v }); });
    // Manuales
    W.fechaInforme = dte(get('DISPONIBLE REAL', 'C5'));
    W.impuestos = { ICO: num(get('DISPONIBLE REAL', 'E19')), 'Retención': num(get('DISPONIBLE REAL', 'E20')), ICA: num(get('DISPONIBLE REAL', 'E21')), IVA: num(get('DISPONIBLE REAL', 'E22')) };
    W.tarjetas = num(get('DISPONIBLE DISTRIBUIR', 'B13'));
    W.reservaImp = num(get('DISPONIBLE DISTRIBUIR', 'B14'));
    W.reservaManual = num(get('FLUJO 14D', 'E6'));
    W.primerLunes = dte(get('RESUMEN_SEMANAL', 'C4'));
    W.correos = {};
    rows('CORREOS', 5, 300, function (g) { var p = str(g('C')); if (p) W.correos[p.toLowerCase()] = str(g('D')); });
    // Cifras que calculó el Excel (para cotejar)
    W.excel = {
      fecha: W.fechaInforme,
      caja: num(get('DISPONIBLE REAL', 'E7')), disponible: num(get('DISPONIBLE REAL', 'E23')),
      pendProv: num(get('DISPONIBLE REAL', 'E14')), pendPers: num(get('DISPONIBLE REAL', 'E15')), pendServ: num(get('DISPONIBLE REAL', 'E16')), pendGast: num(get('DISPONIBLE REAL', 'E17')),
      mega: num(get('DISPONIBLE REAL', 'E9'))
    };
    W.cargado = new Date().toISOString();
    return W;
  }

  var CATS = { prov: 'Proveedores', serv: 'Servicios', pers: 'Personal', gast: 'Gastos varios' };
  function isICO(t) { return /ico del d/i.test(t); }
  function sum(a, f) { var s = 0; for (var i = 0; i < a.length; i++) s += f(a[i]); return s; }
  function cashReint(m) { return eq(m.tipo, 'Reintegro') && m.banco && !eq(m.banco, 'Pago de proveedor') && !eq(m.banco, 'Compra insumos'); }
  function cashPrest(m) { return eq(m.tipo, 'Préstamo') && m.banco; }

  function realAt(W, D) {
    var row = null, exact = false;
    for (var i = 0; i < W.real.length; i++) { var r = W.real[i]; if (r.f === D) { row = r; exact = true; } }
    if (!row) { W.real.forEach(function (r) { if (r.f <= D && (!row || r.f >= row.f)) row = r; }); }
    if (!row) return { total: 0, row: null, exact: false, zeros: [] };
    var prev = null; W.real.forEach(function (r) { if (r.f < row.f && (!prev || r.f > prev.f)) prev = r; });
    var zeros = [];
    W.realCols.forEach(function (c, i) { if (!c.auto && row.v[i] === 0) { var last = null; W.real.forEach(function (r) { if (r.f < row.f && r.v[i] !== 0 && (!last || r.f > last.f)) last = r; }); if (last) zeros.push({ name: c.name, last: last.v[i], lastF: last.f }); } });
    return { total: sum(row.v, function (x) { return x; }), row: row, exact: exact, zeros: zeros };
  }
  function cxcAt(W, D) {

  function primerExcel(err) {
    show('\x3cp class="g-msg">Todavía no hay datos guardados. Cargue el Excel de Tesorería Integrada para empezar.\x3c/p>' + (err ? '\x3cp class="g-err">' + esc(err) + '\x3c/p>' : '') +
      '\x3clabel class="g-btn" for="g-file">Cargar Excel\x3c/label>\x3cinput id="g-file" type="file" accept=".xlsx,.xlsm,.xls" hidden>' + salir());
    bindSalir();
    document.getElementById('g-file').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      show('\x3cp class="g-msg">Leyendo y guardando ' + esc(f.name) + '…\x3c/p>');
      parseFile(f).then(function (W) { return window.MX_SAVE(W, f.name).then(function () { boot(W); }); })
        .catch(function (er) { primerExcel(er.message || 'No se pudo guardar.'); });
    };
  }
  function salir() { return '\x3cbutton class="g-link" id="g-out" type="button">Cerrar sesión\x3c/button>'; }
  function bindSalir() { var b = document.getElementById('g-out'); if (b) b.onclick = function () { auth.signOut().then(function () { location.reload(); }); }; }

  var booted = false;
  function boot(W) {
    if (booted) { location.reload(); return; }
    booted = true;
    window.MX_INITIAL = W;
    gate.hidden = true; gate.innerHTML = '';
    new Function(document.getElementById('mx-app').textContent)();
    var foot = document.createElement('div'); foot.className = 'g-foot';
    foot.innerHTML = '\x3cspan>' + esc(auth.currentUser ? auth.currentUser.email : '') + '\x3c/span>' + salir();
    document.body.appendChild(foot); bindSalir();
  }

  show('\x3cp class="g-msg">Cargando…\x3c/p>');
  auth.onAuthStateChanged(function (u) {
    if (!u) { if (booted) location.reload(); else loginForm(); return; }
    if (booted) return;
    show('\x3cp class="g-msg">Cargando datos…\x3c/p>');
    REF.get().then(function (snap) {
      if (snap.exists && snap.data().json) boot(JSON.parse(snap.data().json));
      else primerExcel();
    }).catch(function (er) {
      show('\x3cp class="g-err">' + (er.code === 'permission-denied' ? 'Su usuario (' + esc(u.email) + ') no tiene permiso para ver estos datos. Pida que lo agreguen en las reglas de Firestore.' : 'No se pudieron cargar los datos: ' + esc(er.message || er.code)) + '\x3c/p>' + salir());
      bindSalir();
    });
  });
})();
</script>
</body>
</html>
