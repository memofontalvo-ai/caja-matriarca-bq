<!doctype html>
<!--
  Flujo de Caja La Matriarca — versión 3.5

  HISTORIAL DE VERSIONES
  v3.5 (5 oct 2026) — PDF con el máximo aprovechamiento de la hoja.
    · Los grupos ya no empiezan en hoja nueva: siguen uno tras otro
      (cada uno con su banda y su total) y se llena toda la hoja.
    · Un proveedor con varias facturas puede continuar en la hoja
      siguiente (con "continuación") en vez de dejar espacio en blanco.
    · Encabezado de columnas una sola vez por grupo (no por proveedor),
      filas de una sola línea y proveedor con total de una línea.
  v3.4 (5 oct 2026) — PDF más compacto.
    · Se quitaron las líneas de firma y los espacios en blanco.
    · Letra, filas y márgenes más ajustados: caben más proveedores por
      hoja carta y el informe final ocupa menos hojas.
  v3.3 (5 oct 2026) — PDF: cada grupo empieza en su propia hoja.
    · Proveedores, Servicios, Personal y Gastos: cada grupo arranca en
      hoja nueva con su título y total arriba y su total general al
      final del grupo. Dentro, paquetes con varios proveedores por hoja.
    · El informe final sigue al cierre, por proveedor y por grupo.
  v3.2 (5 oct 2026) — PDF por paquetes (ahorra hojas).
    · En cada hoja carta caben varios proveedores: cada uno con su
      cuadro (facturas y total) y la hoja se llama "Paquete 1", "Paquete 2"...
    · Un proveedor no se parte entre hojas, salvo que tenga tantas
      facturas que no quepa en una.
    · El informe final dice en qué paquete quedó cada proveedor.
  v3.1 (5 oct 2026) — PDF tamaño carta de los pagos autorizados.
    · Botón "Descargar PDF (tamaño carta)" y "Ver PDF" en el informe.
    · Una hoja por proveedor: nombre, todas sus facturas (número, fecha,
      vencimiento, días vencida) y el total a pagar al final; con líneas
      de firma. Orden: Proveedores, Servicios, Personal y Gastos.
    · Al final, el informe de todo lo que se paga a cada proveedor, con
      subtotal por grupo y total autorizado.
  v3.0 (5 oct 2026) — Informe de pagos autorizados ordenado.
    · El informe guardado sale por grupos (Proveedores, Servicios,
      Personal, Gastos) con el total arriba; dentro, cada proveedor con
      su subtotal y sus facturas (número, fechas, vencida en rojo).
    · Cada grupo y cada proveedor se abre y se recoge; hay "Abrir todos"
      y "Cerrar todos". Al imprimir sale todo abierto.
    · El texto para compartir también va agrupado por proveedor.
  v2.9 (5 oct 2026) — Marcar por rango de vencimiento.
    · En Pagos autorizados hay botones: Solo vencidas, Vencidas + hoy,
      Hasta 3, 5, 7 o 15 días, y una fecha límite. Cada botón dice cuántas
      facturas y cuánto suman, y al tocarlo chulea solas las facturas de
      ese rango (respeta el filtro de grupo y la búsqueda).
    · Nuevo filtro "Solo marcadas" para revisar lo que quedó chuleado.
  v2.8 (5 oct 2026) — Pagos autorizados ordenado por grupos.
    · Las facturas pendientes salen agrupadas como en Programación de
      pagos: Proveedores, Servicios, Personal y Gastos, cada grupo con su
      total arriba (se abre y se cierra).
    · Dentro de cada grupo, cada proveedor muestra cuántas facturas tiene
      vencidas y cuánto debe; se abre para chulear factura por factura.
    · Las facturas vencidas salen en rojo, ordenadas de la más vencida a
      la menos vencida; las que vencen en 7 días, en amarillo.
    · Botones "Marcar todo" por grupo y por proveedor, y "Abrir todos /
      Cerrar todos".
  v2.7 (5 oct 2026) — Misma funcionalidad que 2.6.
    · Versión reenviada para comprobar que la actualización llega.
  v2.6 (5 oct 2026) — Pagos autorizados.
    · Nuevo botón "Pagos autorizados" en el menú. El administrador marca
      las facturas que autoriza para la semana (con fecha de factura,
      vencimiento y días vencida) y toca "Guardar autorización".
    · La autorización queda guardada por semana, con quién la hizo y
      cuándo. No modifica el Excel.
    · Informe de la autorización agrupado por concepto, con subtotales,
      total y espacio para firmas; se puede imprimir o guardar como PDF
      y compartir como texto.
    · Compara lo autorizado con el último Excel (si ya no figura pendiente).
    · Contabilidad y Consulta pueden ver e imprimir el informe; solo el
      administrador autoriza.
    · Requiere publicar de nuevo las reglas de Firestore (firestore.rules).
    · Programación de pagos vuelve a ser solo de consulta.
  v2.5 (5 oct 2026) — Armar la programación de pagos (lista para chulear).
    · Lista de facturas pendientes con fecha de factura, vencimiento, días
      vencida y programación, con total de lo marcado e informe compartible.
      (En v2.6 esta lista pasó al módulo "Pagos autorizados".)
  v2.4 (5 oct 2026) — Permiso "Contabilidad".
    · Nuevo permiso para los usuarios de contabilidad: ven todos los
      módulos y pueden subir el Excel, igual que el administrador.
    · No pueden entrar a Administración de usuarios (crear, editar,
      restablecer o eliminar usuarios): eso es solo del administrador.
    · Solo consulta sigue sin poder subir el Excel.
    · Requiere publicar de nuevo las reglas de Firestore (firestore.rules).
  v2.3 (5 oct 2026) — Programación de pagos más corta.
    · Cada concepto (Proveedores, Servicios, Personal, Gastos varios)
      sale cerrado con su título y su total arriba. Al tocarlo se abre
      el detalle por tercero y al tocarlo otra vez se esconde.
  v2.2 (5 oct 2026) — Último Excel subido.
    · En la parte de arriba de cada módulo se muestra la fecha y hora en
      que se subió el último Excel a la aplicación, quién lo subió y el
      nombre del archivo.
    · La hora se registra al guardar para todos.
  v2.1 (5 oct 2026) — Programación de pagos.
    · Nuevo módulo "Programación de pagos" en el menú: lo programado
      para cada semana (lunes a domingo) según la fecha de programación
      del Excel, igual que la hoja PROGRAMACION_PAGOS.
    · Total programado por concepto, cuánto se ha pagado y cuánto falta.
    · Detalle por tercero con sus facturas, valor a pagar, pagado y saldo.
    · Muestra también lo atrasado de semanas anteriores y lo que aún
      no tiene fecha de programación.
  v2.0 (3 oct 2026) — Restablecer contraseña.
    · Botón "Restablecer contraseña" en cada usuario de Administración
      de usuarios, con una contraseña sugerida que se puede cambiar.
  v1.9 (2 oct 2026) — Ingresos y egresos completos.
    · Nuevo módulo "Egresos y gastos": todo lo causado (pagado y sin pagar)
      por concepto y por tipo, con selector de mes y de periodo
      (todo el mes, una semana o un rango de fechas), egresos por semana,
      por mes, gráfica por día y el detalle por tercero con su estado.
    · "Ventas" pasa a ser "Ventas e ingresos": suma otros ingresos
      (cartera, abonos, reintegros) y muestra el total de ingresos.
  v1.8 (2 oct 2026) — Totales de cuentas por pagar más claros.
    · "Total por concepto" (proveedores, servicios, personal, gastos varios)
      con su total, que es igual a vencido + sin fecha.
    · Tarjeta de gastos varios (y personal cuando tenga saldo), para que
      la suma por tipo cuadre con el total.
    · Se quitó la tabla ancha que en el celular dejaba el total por fuera.
  v1.7 (2 oct 2026) — Cuentas por pagar como módulo aparte.
    · Nueva tarjeta "Cuentas por pagar" en el menú principal.
    · Vista "Pendientes": lo que se debe hoy, insumos por tipo de producto
      y servicios por tipo, con el detalle por proveedor.
    · Vista "Por semana" (lunes a domingo): compras de la semana, cuánto
      está pagado y cuánto pendiente, y cada factura con su estado
      (Pagada, Abono, Pendiente o Nota crédito). Se puede ir a la semana
      anterior y ver el resumen de todas las semanas.
    · Flujo de caja ya no tiene la pestaña "Por pagar".
  v1.6 (2 oct 2026) — Compatible con el Excel "Round 16".
    · La hoja DISPONIBLE REAL se lee por el nombre de cada renglón
      (antes por celda fija), porque el contador reorganizó la hoja:
      MEGAMAS dentro del Total Disponible y las cuentas por cobrar al final.
    · Sirve tanto para el Excel anterior (Round 15) como para el nuevo.
    · Nueva alerta si el disponible real de la app no coincide con el del Excel.
  v1.5 (1 oct 2026) — Ventas como módulo aparte.
    · Nueva tarjeta "Ventas" en el menú principal, con su propia pantalla:
      consolidado, por día o por semana, por punto, impoconsumo, propinas,
      medios de pago y cierres de caja.
    · Flujo de caja ya no tiene la pestaña de Ventas.
  v1.4 (1 oct 2026) — Ver contraseña.
    · Botón de "ojito" para mostrar u ocultar la contraseña al ingresar
      y al cambiarla.
  v1.3 (1 oct 2026) — Ingreso obligatorio y administración de usuarios.
    · Cada vez que se abre la app pide usuario y contraseña.
    · Menú: Flujo de caja, Administración de usuarios (administrador) y Salir.
    · Administración de usuarios: crear, editar (nombre, permiso, estado,
      contraseña) y eliminar usuarios.
    · "Salir" vuelve a la pantalla de ingreso.
  v1.2 (1 oct 2026) — Formato de aplicación.
    · Pantalla de entrada con la imagen de La Matriarca · Tesorería.
    · Menú principal: Flujo de caja, Usuarios (administrador),
      Cambiar contraseña y Cerrar sesión.
    · Botón "‹" para volver al menú y "Salir" en cada pantalla;
      también funciona el gesto de "atrás" del celular.
  v1.1 (1 oct 2026) — Usuarios propios.
    · Se entra con nombre de usuario y contraseña (ya no hace falta el correo).
    · Módulo "Usuarios" solo para el administrador: crear, desactivar,
      cambiar permiso y poner una contraseña nueva.
    · Permisos: Administrador, Puede cargar Excel, Solo consulta.
    · La contraseña inicial se debe cambiar en el primer ingreso.
    · Opción "Cambiar contraseña" para todos.
    · El administrador también puede entrar con el usuario "guillermo".
  v1.0 (1 oct 2026) — Primera versión publicada en GitHub Pages con Firebase.
    · Inicio de sesión con correo y contraseña.
    · Datos guardados en Firestore (tesoreria/actual) con historial de cada carga.
    · Pestañas: Resumen, Ventas, Por pagar, Por cobrar, Bancos y cajas,
      Movimiento del día, Semanas, Próximos 14 días.

-->

<style>body{margin:0}[hidden]{display:none!important}
/* Layout: barra superior fija con fecha de corte + pestañas; contenido en una columna de 1100px; estado financiero como lista contable. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E9EDE8; --ink:#16201B; --muted:#5B6760; --faint:#8A958F; --line:#D9E0DA;
  --accent:#1E5B47; --accent-ink:#FFFFFF; --accent-soft:#E1EEE7;
  --s1:#2A8A64; --s2:#C2701F;
  --good:#23734A; --good-bg:#E2F1E7; --warn:#9A6212; --warn-bg:#FBF0DA; --bad:#B0372B; --bad-bg:#FBE6E2; --info:#3D5A80; --info-bg:#E6EDF6;
  --f-display:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --bar:#173F32; --bar-ink:#FFFFFF; --bar-muted:#A9C7BA; --pos-bg:#E4F1EA; --neg-bg:#FBEAE6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --sunk:#1C2621; --ink:#E6ECE8; --muted:#A1ADA6; --faint:#76827B; --line:#2A3630;
  --accent:#5DB592; --accent-ink:#0E1411; --accent-soft:#1D3229;
  --s1:#2E9A6F; --s2:#C9782A;
  --good:#6CCB95; --good-bg:#18301F; --warn:#E6B45E; --warn-bg:#33280F; --bad:#F08A7C; --bad-bg:#3A1B17; --info:#9DB8E0; --info-bg:#1B2536; --bar:#101915; --bar-ink:#E6ECE8; --bar-muted:#8FA89C; --pos-bg:#17291F; --neg-bg:#2E1815;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --sunk:#1C2621; --ink:#E6ECE8; --muted:#A1ADA6; --faint:#76827B; --line:#2A3630;
  --accent:#5DB592; --accent-ink:#0E1411; --accent-soft:#1D3229;
  --s1:#2E9A6F; --s2:#C9782A;
  --good:#6CCB95; --good-bg:#18301F; --warn:#E6B45E; --warn-bg:#33280F; --bad:#F08A7C; --bad-bg:#3A1B17; --info:#9DB8E0; --info-bg:#1B2536; --bar:#101915; --bar-ink:#E6ECE8; --bar-muted:#8FA89C; --pos-bg:#17291F; --neg-bg:#2E1815;
  color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px 10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.datebox{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.datebox button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted)}
.datebox button:hover{background:var(--sunk);color:var(--ink)}
.datebox input{border:0;background:transparent;padding:4px 2px;font-weight:600;min-width:0;width:9.5em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .ct{font-weight:500;color:var(--faint);margin-left:4px}
main{padding-block:20px 60px;display:grid;gap:20px}
.meta{font-size:12.5px;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--info-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner.err{background:var(--bad-bg)}
h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.sec{display:grid;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid3{grid-template-columns:minmax(0,1fr)}}
/* Estado */
.hero-lbl{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero-num{font-family:var(--f-display);font-size:clamp(34px,7vw,52px);line-height:1.05;margin:6px 0 14px;letter-spacing:-.01em}
.neg{color:var(--bad)}
.stmt{display:grid;border-top:1px solid var(--line)}
.stmt .l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.stmt .l.grp{font-weight:700;padding-top:12px}
.stmt .l.sub{padding-left:16px;color:var(--muted);font-size:14px;border-bottom-style:dotted}
.stmt .l.hd{grid-template-columns:minmax(0,1fr);font-weight:700;padding-top:14px}
.stmt .l.sub.pt{grid-template-columns:minmax(0,1fr);color:var(--ink);font-weight:600}
.stmt .l.sub.ptt{padding-left:16px;color:var(--ink);font-weight:600;border-bottom-style:solid}
.stmt .l.sub.pt2{color:var(--ink);font-weight:600;align-items:center}
.hint{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.final.small .fv{font-weight:700;font-size:18px}
.final.small{border-top-width:1px;border-top-style:solid}
.stmt .l.st{font-weight:700;border-bottom:1px solid var(--ink)}
.final{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;border-top:3px double var(--ink);margin-top:14px;padding-top:10px}
.final>span:first-child{font-weight:700;font-size:16px}
.final .hero-num{margin:0}
.stmt .l.sub.acc{padding-left:32px;font-size:13.5px}
.stmt .l.tot{font-weight:700;border-bottom:3px double var(--ink);font-size:16px}
.stmt .l a,.linkbtn{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;background:none;border:0;padding:0;font:inherit;text-align:left}
.stmt .l a:hover,.linkbtn:hover{text-decoration-color:var(--accent)}
.amt{text-align:right;white-space:nowrap}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:21px;font-weight:700;letter-spacing:-.01em}
.tile .n{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.rojo{background:var(--bad-bg);color:var(--bad)} .chip.amarillo{background:var(--warn-bg);color:var(--warn)} .chip.verde{background:var(--good-bg);color:var(--good)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.neutro{background:var(--sunk);color:var(--muted)}
.chip i{font-style:normal}
/* Alertas */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.alert .ic{grid-row:span 2;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.alert.rojo .ic{background:var(--bad-bg);color:var(--bad)} .alert.amarillo .ic{background:var(--warn-bg);color:var(--warn)} .alert.info .ic{background:var(--info-bg);color:var(--info)}
.alert b{font-size:14px} .alert span{font-size:13.5px;color:var(--muted)}
/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk)}
/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
/* Terceros */
.parties{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.party{border-bottom:1px solid var(--line)} .party:last-child{border-bottom:0}
.party>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;cursor:pointer}
.party>summary::-webkit-details-marker{display:none}
.party>summary:hover{background:var(--sunk)}
.party .nm{font-weight:700;overflow-wrap:anywhere}
.party .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.party .tot{font-weight:700;text-align:right;white-space:nowrap}
.party .inv{padding:0 16px 14px;overflow-x:auto}
.party .inv table{font-size:13px}
.party .inv td,.party .inv th{padding:6px 8px}
.catdot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--faint);margin-right:2px}
.mail{font-size:12px;color:var(--muted);padding:8px 0 0;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink);stroke-width:1;opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:6px;max-width:260px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}
.kv .amt{font-weight:600}
input.num{width:10em;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);text-align:right}
.hide-sm{} @media (max-width:620px){.hide-sm{display:none}}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}

.stmt .l.st.big{font-size:15.5px;border-bottom:2px solid var(--ink);padding-block:10px}
.stmt.aparte{margin-top:22px;border-top:1px dashed var(--line);opacity:.95}

/* ---- Barra de aplicación ---- */
header.top{background:var(--bg);border-bottom:0}
header.top .bar{background:var(--bar);color:var(--bar-ink)}
header.top .top-row{padding-block:12px}
.brand small{color:var(--bar-muted)}
.brand b{font-family:var(--f-body);font-weight:800;font-size:20px;letter-spacing:-.01em}
header.top .datebox{background:rgba(255,255,255,.1);border-color:transparent;color:var(--bar-ink)}
header.top .datebox button{color:var(--bar-muted)}
header.top .datebox button:hover{background:rgba(255,255,255,.14);color:var(--bar-ink)}
header.top .datebox input{color:var(--bar-ink);color-scheme:dark}
header.top .btn.pri{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
.tabbar{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{padding:12px 12px 11px}
/* ---- Encabezado de página ---- */
.page-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.page-h h2{font-family:var(--f-body);font-weight:800;font-size:22px;letter-spacing:-.01em}
h2{font-family:var(--f-body);font-weight:800;font-size:19px;letter-spacing:-.01em}
.hero-num{font-family:var(--f-body);font-weight:800;letter-spacing:-.02em}
/* ---- Tarjetas ---- */
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cards2>.col{display:grid;gap:16px;align-content:start;min-width:0}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:980px){.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.cards2,.cards3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(16,32,24,.05)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.card-t{min-width:0;flex:1}
.card-t h3{margin:0;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700}
.card-t small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ico{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.t-pos .ico,.t-good .ico{background:var(--pos-bg);color:var(--good)}
.t-neg .ico,.t-bad .ico{background:var(--neg-bg);color:var(--bad)}
.card-go{flex:none;border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 0}
.card-go:hover{text-decoration:underline}
.card-b{padding:0 16px 6px;display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row>span:first-child{color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:600}
.row.sub{border-bottom:1px solid var(--line);font-weight:700}
.row.sub>span:first-child{color:var(--ink)}
.grp-t{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 0 2px}
.card-f{margin-top:auto;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:12px 16px;background:var(--sunk);border-top:1px solid var(--line)}
.card-f span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card-f strong{font-size:24px;font-weight:800;letter-spacing:-.02em}
.t-pos .card-f{background:var(--pos-bg)}
.t-neg .card-f{background:var(--neg-bg)}
.card.big .card-f strong{font-size:32px}
.t-good{border-color:var(--good)} .t-good .card-f{background:var(--good);border-top-color:var(--good)} .t-good .card-f span,.t-good .card-f strong{color:var(--surface)}
.t-bad{border-color:var(--bad)} .t-bad .card-f{background:var(--bad);border-top-color:var(--bad)} .t-bad .card-f span,.t-bad .card-f strong{color:var(--surface)}
.card-x{padding:4px 16px 12px}
.card-x .row{border-bottom:0}
.card-x .note{margin:0}
@media (max-width:560px){.card-f{flex-direction:column;align-items:flex-start;gap:2px}.card-f strong{font-size:26px}.card.big .card-f strong{font-size:32px}}

.av{margin:2px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.nav-back{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--bar-ink);font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
.nav-back:hover{background:rgba(255,255,255,.2)}
.nav-exit{flex:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--bar-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
@media (min-width:760px){.nav-exit{order:10}}
@media (max-width:759px){
  header.top .top-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"back brand exit" "date date up";align-items:center;gap:10px}
  header.top .nav-back{grid-area:back}
  header.top .brand{grid-area:brand;min-width:0;margin:0}
  header.top .brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.top .nav-exit{grid-area:exit;justify-self:end}
  header.top .datebox{grid-area:date;justify-self:start}
  header.top .datebox input{width:8.6em}
  header.top .btn.pri{grid-area:up;padding:7px 12px}
  .hide-xs{display:none}
}

.row-btn{width:100%;background:none;border:0;border-bottom:1px dashed var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit;font-size:14px}
.row-btn:hover>span:first-child{color:var(--accent)}
.weeknav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.weeknav-t{display:grid;text-align:center;min-width:0}
.weeknav-t small{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.weeknav-t b{font-size:16px}
.weeknav .btn:disabled{opacity:.4;cursor:default}
.bar-pct{height:10px;border-radius:999px;background:var(--neg-bg);overflow:hidden;margin:4px 0 8px}
.bar-pct i{display:block;height:100%;background:var(--good);border-radius:999px}
tr.row-link{cursor:pointer}
tr.row-link:hover td{background:var(--sunk)}
tr.row-link.on td{background:var(--accent-soft);font-weight:600}
@media (max-width:480px){.weeknav .btn{padding:7px 10px;font-size:13px}.weeknav-t b{font-size:14px}}

.parties{grid-template-columns:minmax(0,1fr)}
.party{min-width:0}
.fxs{padding:0 16px 12px;display:grid}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.fx-a{display:grid;gap:1px;min-width:0}.fx-a b{overflow-wrap:anywhere}
.fx-b{display:grid;gap:2px;justify-items:end;text-align:right}
.fx-c{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:14px}
.fx-c span{display:grid}.fx-c span:nth-child(2){text-align:center}.fx-c span:last-child{text-align:right}
.fx-c small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
@media (min-width:760px){.fx{grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) auto;align-items:center}.fx-c{grid-column:2;grid-row:1}.fx-b{grid-column:3}}

.sumline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--muted)}
.sumline b{font-size:17px;color:var(--ink);white-space:nowrap;margin-left:auto}
.row-2 small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:1px}
.row-2>span:first-child{color:var(--ink);font-weight:600}

.pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pick>label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:58px}
.pick .seg{border-radius:14px}
.pick .seg button{text-transform:capitalize}
.pick .seg button[data-eper]{text-transform:none}
input.dt{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);font-size:15px}
.row-btn.on>span:first-child{color:var(--accent)}
.row-btn.on{background:var(--accent-soft);margin:0 -8px;padding-left:8px;padding-right:8px;width:calc(100% + 16px);border-radius:8px}

/* v2.1 · programación de pagos */
.card.blk .parties.flat{border:0;border-radius:0;border-top:1px solid var(--line);background:none}
.card.blk .card-f strong{font-size:22px}
.party .refs{overflow-wrap:anywhere;color:var(--faint)}
.pick .seg button[data-gdia]{text-transform:none}

/* v2.2 · última actualización del Excel */
.xl-upd{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 14px;margin-bottom:12px}
.xl-k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;flex-basis:100%}
.xl-upd b{font-size:16px;color:var(--ink)} .xl-upd b.xl-no{color:var(--warn)}
.xl-n{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

/* v2.3 · conceptos plegables en programación */
.card.blk>summary.blk-s{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.card.blk>summary.blk-s::-webkit-details-marker{display:none}
.card.blk>summary.blk-s:hover{background:var(--sunk)}
.blk-t{margin-left:auto;text-align:right;display:grid;gap:1px;flex:none}
.blk-t small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.blk-t strong{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.blk .chev{flex:none;font-size:22px;color:var(--muted);transition:transform .15s;line-height:1}
.card.blk[open] .chev{transform:rotate(90deg)}
.card.blk[open]>summary.blk-s{border-bottom:1px solid var(--line)}
.card.blk .card-t{flex:1;min-width:0}
@media (max-width:420px){.blk-t strong{font-size:18px}.card.blk>summary.blk-s{padding:12px}}

/* v2.5 · armar programación (checklist) */
.ckl{overflow:visible}
.ckrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface)}
.ckrow:first-child{border-top:0}
.ckrow.on{background:var(--accent-soft)}
.ckrow input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.ck-b{display:grid;gap:2px;min-width:0}.ck-b b{overflow-wrap:anywhere}.ck-b .meta{overflow-wrap:anywhere}
.ck-a{font-weight:800;white-space:nowrap;text-align:right}
.ck-tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.ck-tools .btn{padding:6px 10px;font-size:13px}
.ck-share{display:grid;gap:6px;justify-items:start}
.ck-space{height:92px}
.ck-bar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:30}
.ck-bar small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:700}
.ck-bar b{font-size:22px;letter-spacing:-.02em}
.ck-bar .btn{text-decoration:none}

/* v2.6 · pagos autorizados */
.banner.warn{background:var(--warn-bg)}
.rep{display:grid;gap:14px}
.rep-h{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.rep-h small{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rep-h h2{margin:0;font-size:22px}
.rep-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.rep-meta span{display:grid;gap:1px}.rep-meta b{font-size:15px;overflow-wrap:anywhere}
.rp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:start}
.rp-a{display:grid;gap:2px;min-width:0}.rp-a b{overflow-wrap:anywhere}.rp-a .meta{overflow-wrap:anywhere}
.rp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.rp-v{font-weight:800;white-space:nowrap}
.rp-sub{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--sunk);border-top:1px solid var(--line);font-weight:700}
.rep-tot{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;background:var(--ink);color:var(--surface);border-radius:var(--r);padding:16px}
.rep-tot span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}.rep-tot strong{font-size:30px;font-weight:800;letter-spacing:-.02em}
.rep-sign{display:none}
@media (min-width:600px){.rep-meta{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{
  body{background:#fff!important}
  .top,.tabbar,.xl-upd,.no-print,.ck-bar,.ck-space,.weeknav,.banner,.filters,.btn,.seg{display:none!important}
  main>*:not(.rep){display:none!important}
  .wrap{max-width:none!important;padding:0!important}
  .rep{gap:10px}
  .card,.rep-h{box-shadow:none!important;border:1px solid #999!important;break-inside:avoid}
  .rep-tot{background:#fff!important;color:#000!important;border:2px solid #000;break-inside:avoid}
  .chip{border:1px solid #999;background:#fff!important;color:#000!important}
  .rep-sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
  .rep-sign div{border-top:1px solid #000;padding-top:6px;text-align:center;font-size:13px}
}

/* v2.8 pagos autorizados agrupados */
.ckrow.venc{background:#fdecea;border-left:5px solid #c0392b}
.ckrow.venc.on{background:#f9d6d1}
.ckrow.prox{border-left:5px solid #d99a1b}
.ckrow.on{outline:0}
.party.pv>summary .nm{color:#a93226}
.card.blk .ckl .ckrow:first-of-type{border-top:1px solid var(--line)}
.ckrow{border-left:5px solid transparent}
.ckrow.venc{border-left-color:#c0392b}.ckrow.prox{border-left-color:#d99a1b}

/* v2.9 rango de vencimiento */
.rng{display:grid;gap:10px;margin:12px 0}
.rng-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rng-o{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px}
.rng-o small{color:var(--muted);font-weight:500}
.rng-o.on{background:var(--accent-soft);border-color:var(--accent)}

/* v3.0 informe agrupado */
.rep-c .parties.flat{padding:0}
.rep .rp-row.venc{border-left:5px solid #c0392b;background:#fdecea}
.rep .party>summary{padding:12px 14px}
.rep-c>.rp-sub{border-top:2px solid var(--line)}
@media print{
  .rep details>summary .chev{display:none}
  .rep .card.blk{break-inside:auto;box-shadow:none}
  .rep .party{break-inside:avoid}
  .rep .rp-row.venc{background:#fdecea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Pantallas de marca: fondo verde con la imagen de La Matriarca */

.scr-in{width:100%;max-width:520px;padding:calc(min(100vw,520px) * .9) 18px 40px;display:grid;gap:14px;align-content:start}
.g-card{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:22px 20px;display:grid;gap:14px;color:var(--cream);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.g-h{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:.02em;color:var(--cream)}
.g-form{display:grid;gap:8px}
.g-form label{font-size:13px;font-weight:600;color:var(--gold-soft);margin-top:4px;letter-spacing:.02em}
.g-form input,.g-form select{border:1px solid var(--glass-line);border-radius:12px;padding:12px 13px;background:rgba(255,255,255,.94);color:#14231B;font-size:16px}
.g-form input:focus,.g-form select:focus{outline:2px solid var(--gold);outline-offset:1px}
.g-btn{display:block;text-align:center;border:0;border-radius:12px;padding:13px;background:linear-gradient(180deg,#D8B56B,#B88E43);color:#1D1608;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;letter-spacing:.02em}
.g-btn:disabled{opacity:.6}
.g-msg{margin:0;color:var(--cream);opacity:.9}
.g-err{margin:0;color:#FFB4A8;font-weight:600}
.g-err:empty{display:none}
.g-link{border:0;background:none;color:var(--gold-soft);font-weight:600;padding:4px 0;cursor:pointer;justify-self:center}
.g-ver{margin:0;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(228,204,147,.6)}
.g-ok{margin:0;background:rgba(108,203,149,.16);color:#BDEBCF;border:1px solid rgba(108,203,149,.35);border-radius:12px;padding:10px 12px;font-weight:600}
/* Menú */
.m-hi{display:grid;gap:2px;color:var(--cream);text-align:center}
.m-hi small{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
.m-hi b{font-size:22px;font-weight:800}
.m-hi span{font-size:13px;color:rgba(244,236,218,.7)}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.m-tile{display:grid;gap:6px;justify-items:start;text-align:left;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:16px 14px;color:var(--cream);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:132px;transition:transform .15s,border-color .15s}
.m-tile:hover{border-color:var(--gold);transform:translateY(-1px)}
.m-tile b{font-size:16px;font-weight:800}
.m-tile small{font-size:12.5px;color:rgba(244,236,218,.72);line-height:1.35}
.m-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(201,163,90,.16);color:var(--gold-soft)}
.m-tile:first-child{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;column-gap:14px;padding:18px 16px;border-color:var(--gold)}
.m-tile:first-child .m-ic{grid-row:span 2;width:52px;height:52px;background:linear-gradient(180deg,#D8B56B,#B88E43);color:#1D1608}
.m-tile:first-child b{font-size:19px}
.m-out .m-ic{background:rgba(255,180,168,.12);color:#FFB4A8}
/* Paneles internos (usuarios) */
#gate.g-full{background:var(--bg)}
.g-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bar);color:var(--bar-ink)}
.g-back{flex:none;border:0;background:rgba(255,255,255,.12);color:var(--bar-ink);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer}
.g-bt{flex:1;min-width:0;display:grid}.g-bt small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted)}.g-bt b{font-size:19px;font-weight:800}
.g-exit{flex:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--bar-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.g-panel{max-width:720px;margin:0 auto;padding:18px 16px 48px;display:grid;gap:16px}
.g-panel .g-ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.g-panel .g-err{color:var(--bad)}
.g-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:8px;color:var(--ink)}
.g-box h3{margin:0 0 4px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
.g-panel .g-form label{color:var(--muted)}
.g-panel .g-form input,.g-panel .g-form select{border-color:var(--line);background:var(--bg);color:var(--ink)}
.g-panel .g-btn{background:var(--accent);color:var(--accent-ink)}
.g-hint{margin:2px 0 0;font-size:13px;color:var(--muted)}
.g-panel .g-msg{color:var(--muted)}
.g-u{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.g-u:first-child{border-top:0}
.g-u.off .g-ui{opacity:.55}
.g-ui{display:grid;gap:2px;min-width:0}.g-ui span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.g-ui code{font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:5px;color:var(--ink)}
.g-ua{display:flex;flex-wrap:wrap;gap:8px}
.g-ua select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font-size:14px;color:var(--ink)}
.g-sm{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;cursor:pointer}
.g-sm.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.g-rs{display:grid;gap:6px}.g-rs label{font-size:13px;color:var(--muted)}
.g-row{display:flex;gap:8px}.g-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:16px;color:var(--ink)}
.g-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}
@media (prefers-reduced-motion:reduce){.m-tile{transition:none}}
.m-out{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;padding:12px 14px}
.m-out .m-ic{grid-row:span 2;width:38px;height:38px}
.m-out b{font-size:15px}
.g-del{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.g-sm.g-del:hover{background:var(--bad-bg)}
.g-warn{margin:0;font-size:14px;color:var(--ink);background:var(--bad-bg);border-radius:8px;padding:10px 12px}
.g-edit{background:var(--sunk);border-radius:10px;padding:12px}
.g-panel .g-form input:disabled{opacity:.6}
.m-grid .m-tile:not(.m-out){grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;column-gap:14px}
.m-grid .m-tile:not(.m-out) .m-ic{grid-row:span 2}
.m-grid .m-main{border-color:var(--gold)}
.m-grid .m-main .m-ic{width:48px;height:48px;background:linear-gradient(180deg,#D8B56B,#B88E43);color:#1D1608}
.m-grid .m-main b{font-size:18px}

.g-pw{position:relative;display:block}
.g-pw input{width:100%;padding-right:48px !important}
.g-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:#5B6760;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.g-eye:hover{color:#14231B;background:rgba(0,0,0,.05)}
.g-panel .g-eye{color:var(--muted)}

.scr-in{gap:12px}

.m-grid .m-tile:not(.m-out){padding:14px}
.m-tile:first-child .m-ic{width:48px;height:48px}
.m-tile:first-child b{font-size:18px}
.scr-in{gap:10px}.m-grid{gap:10px}
</style>

  var OJO_NO = '\x3csvg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">\x3cpath d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>\x3c/svg>';
  function ojitos(root) {
    (root || document).querySelectorAll('input[type="password"]:not([data-ojo])').forEach(function (inp) {
      inp.setAttribute('data-ojo', '1');
      var w = document.createElement('div'); w.className = 'g-pw';

      b.onclick = function () { var ver = inp.type === 'password'; inp.type = ver ? 'text' : 'password'; b.innerHTML = ver ? OJO_NO : OJO; b.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña'); inp.focus(); };
      w.appendChild(b);

  }
  new MutationObserver(function () { ojitos(gate); }).observe(gate, { childList: true, subtree: true });
  function hideApp() { var a = $('app'); if (a) a.hidden = true; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  if (!cfg.apiKey || /PEGUE|TU_/i.test(cfg.apiKey)) { show('\x3cp class="g-msg">Falta configurar Firebase. Abra este archivo \x3cb>index.html\x3c/b>, busque el bloque “CONFIGURACIÓN DE FIREBASE” al inicio y pegue los datos de su proyecto.\x3c/p>'); return; }
  if (!window.firebase) { show('\x3cp class="g-msg">No se pudo cargar Firebase. Revise la conexión a internet y recargue la página.\x3c/p>'); return; }
  firebase.initializeApp(cfg);
  var auth = firebase.auth(), db = firebase.firestore();
  var abierta = false; try { abierta = sessionStorage.getItem('mx-ses') === '1'; } catch (e) {}
  function marcar(v) { try { v ? sessionStorage.setItem('mx-ses', '1') : sessionStorage.removeItem('mx-ses'); } catch (e) {} }
  var REF = db.collection('tesoreria').doc('actual');
  var perfil = null; // {nombre, usuario, rol, activo, debeCambiar}

  function normUsuario(u) { return String(u || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '.'); }

  function esAdmin() { return (auth.currentUser && auth.currentUser.email === ADMIN_EMAIL) || (perfil && perfil.activo && perfil.rol === 'admin'); }
  function errTxt(er) {
    var c = (er && er.code) || '';
    if (/wrong-password|invalid-credential|invalid-login|user-not-found|invalid-email/.test(c)) return 'Usuario o contraseña incorrectos.';
    if (/too-many-requests/.test(c)) return 'Demasiados intentos. Espere unos minutos y vuelva a intentar.';

  /* ---------- Inicio de sesión ---------- */
  function loginForm(err, usuario) {
    show('\x3cform id="g-login" class="g-form">\x3ch1 class="g-h">Ingresar\x3c/h1>\x3clabel for="g-user">Usuario\x3c/label>\x3cinput id="g-user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required value="' + esc(usuario || '') + '">' +
      '\x3clabel for="g-pass">Contraseña\x3c/label>\x3cinput id="g-pass" type="password" autocomplete="current-password" required>' +
      (err ? '\x3cp class="g-err">' + esc(err) + '\x3c/p>' : '') + '\x3cbutton class="g-btn" type="submit">Entrar\x3c/button>\x3c/form>');
    $('g-login').onsubmit = function (e) {
      e.preventDefault();
      var b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
      var u = $('g-user').value.trim(), p = $('g-pass').value;
      var emailP = u.indexOf('@') >= 0 ? Promise.resolve(u) :
        db.collection('logins').doc(normUsuario(u)).get().then(function (s) { if (!s.exists) throw { code: 'auth/user-not-found' }; return s.data().email; });
      emailP.then(function (email) { marcar(true); abierta = true; return auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(function () { return auth.signInWithEmailAndPassword(email, p); }); })
        .catch(function (er) { marcar(false); abierta = false; loginForm(errTxt(er), u); });
    };
  }

  /* ---------- Cambio de contraseña ---------- */
  function cambiarClave(obligatorio, volver) {
    show('\x3cform id="g-cc" class="g-form">\x3cp class="g-msg">' + (obligatorio ? 'Bienvenido, \x3cb>' + esc(perfil && perfil.nombre || '') + '\x3c/b>. Por seguridad, cambie la contraseña inicial antes de continuar.' : 'Cambiar mi contraseña') + '\x3c/p>' +
      '\x3clabel for="g-act">Contraseña actual\x3c/label>\x3cinput id="g-act" type="password" autocomplete="current-password" required>' +
      '\x3clabel for="g-n1">Contraseña nueva\x3c/label>\x3cinput id="g-n1" type="password" autocomplete="new-password" minlength="6" required>' +
      '\x3clabel for="g-n2">Repita la contraseña nueva\x3c/label>\x3cinput id="g-n2" type="password" autocomplete="new-password" minlength="6" required>' +
      '\x3cp class="g-err" id="g-ccerr">\x3c/p>\x3cbutton class="g-btn" type="submit">Guardar contraseña\x3c/button>' +
      (obligatorio ? salir() : '\x3cbutton class="g-link" type="button" id="g-ccx">‹ Volver al menú\x3c/button>') + '\x3c/form>');
    bindSalir();
    if ($('g-ccx')) $('g-ccx').onclick = function () { volver(); };
    $('g-cc').onsubmit = function (e) {
      e.preventDefault();
      var n1 = $('g-n1').value, n2 = $('g-n2').value, er = $('g-ccerr');
      if (n1.length < 6) { er.textContent = 'La contraseña nueva debe tener al menos 6 caracteres.'; return; }
      if (n1 !== n2) { er.textContent = 'Las dos contraseñas nuevas no coinciden.'; return; }
      if (n1 === $('g-act').value) { er.textContent = 'La contraseña nueva debe ser distinta a la actual.'; return; }
      var b = e.target.querySelector('.g-btn'); b.disabled = true; b.textContent = 'Guardando…';
      var u = auth.currentUser;
      u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, $('g-act').value))
        .then(function () { return u.updatePassword(n1); })
        .then(function () { if (perfil && perfil.debeCambiar) { perfil.debeCambiar = false; return db.collection('usuarios').doc(u.uid).update({ debeCambiar: false, ultimoCambio: firebase.firestore.FieldValue.serverTimestamp() }); } })
        .then(function () { if (obligatorio) menu('Contraseña guardada. Bienvenido.'); else volver('Contraseña cambiada.'); })
        .catch(function (x) { b.disabled = false; b.textContent = 'Guardar contraseña'; er.textContent = /wrong-password|invalid-credential|invalid-login/.test(x.code || '') ? 'La contraseña actual no es correcta.' : errTxt(x); });
    };
  }

    bindBarra();
    $('g-new').onsubmit = function (e) {

      var b = e.target.querySelector('.g-btn'); b.disabled = true; b.textContent = 'Creando…'; er.textContent = '';
      crearCuenta(nom, usr, pas, rol, null).then(function () { modUsuarios('Usuario “' + usr + '” creado. Contraseña inicial: ' + pas); })
        .catch(function (x) { b.disabled = false; b.textContent = 'Crear usuario'; er.textContent = x.msg || errTxt(x); });

    db.collection('usuarios').get().then(function (snap) {

      var opts = function (sel) { return Object.keys(ROLES).map(function (k) { return '\x3coption value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + ROLES[k] + '\x3c/option>'; }).join(''); };
      $('g-list').innerHTML = rows.length ? rows.map(function (u) {

        return '\x3cdiv class="g-u' + (u.activo ? '' : ' off') + '">\x3cdiv class="g-ui">\x3cb>' + esc(u.nombre) + (yo ? ' (usted)' : '') + '\x3c/b>\x3cspan>Usuario: \x3ccode>' + esc(u.usuario) + '\x3c/code> · ' + esc(ROLES[u.rol] || u.rol) + (u.activo ? '' : ' · \x3cem>Desactivado\x3c/em>') + (u.debeCambiar && u.activo ? ' · Pendiente cambiar contraseña' : '') + '\x3c/span>\x3c/div>' +
          '\x3cdiv class="g-ua">' + (yo ? '\x3cbutton class="g-sm" data-mia="1">Cambiar mi contraseña\x3c/button>' : '\x3cbutton class="g-sm" data-edit="' + u.uid + '">Editar\x3c/button>\x3cbutton class="g-sm" data-rst="' + u.uid + '">Restablecer contraseña\x3c/button>\x3cbutton class="g-sm g-del" data-del="' + u.uid + '">Eliminar\x3c/button>') + '\x3c/div>' +
          '\x3cdiv class="g-rs" id="rs-' + u.uid + '" hidden>\x3c/div>\x3c/div>';
      }).join('') : '\x3cp class="g-msg">Todavía no ha creado usuarios.\x3c/p>';
      var mia = gate.querySelector('[data-mia]'); if (mia) mia.onclick = function () { ir('clave'); };
      rows.forEach(function (u) {
        var box = $('rs-' + u.uid);
        var ed = gate.querySelector('[data-edit="' + u.uid + '"]'); if (ed) ed.onclick = function () {
          box.hidden = false;
          box.innerHTML = '\x3cdiv class="g-form g-edit">\x3clabel for="e-nom-' + u.uid + '">Nombre completo\x3c/label>\x3cinput id="e-nom-' + u.uid + '" value="' + esc(u.nombre) + '">' +
            '\x3clabel>Usuario\x3c/label>\x3cinput value="' + esc(u.usuario) + '" disabled>' +
            '\x3clabel for="e-rol-' + u.uid + '">Permiso\x3c/label>\x3cselect id="e-rol-' + u.uid + '">' + opts(u.rol) + '\x3c/select>' +
            '\x3clabel for="e-act-' + u.uid + '">Estado\x3c/label>\x3cselect id="e-act-' + u.uid + '">\x3coption value="1"' + (u.activo ? ' selected' : '') + '>Activo\x3c/option>\x3coption value="0"' + (u.activo ? '' : ' selected') + '>Desactivado (no puede entrar)\x3c/option>\x3c/select>' +
            '\x3clabel for="e-pas-' + u.uid + '">Nueva contraseña (opcional)\x3c/label>\x3cinput id="e-pas-' + u.uid + '" autocomplete="off" placeholder="Déjela vacía para no cambiarla">' +
            '\x3cp class="g-err" id="e-err-' + u.uid + '">\x3c/p>\x3cdiv class="g-ua">\x3cbutton class="g-sm pri" id="e-ok-' + u.uid + '">Guardar cambios\x3c/button>\x3cbutton class="g-sm" id="e-no-' + u.uid + '">Cancelar\x3c/button>\x3c/div>\x3c/div>';

            }).then(function () { modUsuarios('Usuario “' + u.usuario + '” actualizado.' + (np ? ' Contraseña nueva: ' + np + ' (la deberá cambiar al entrar).' : '')); })
              .catch(function (x) { er.textContent = x.msg || errTxt(x); var b = $('e-ok-' + u.uid); if (b) { b.disabled = false; b.textContent = 'Guardar cambios'; } });
          };
        };
        var rst = gate.querySelector('[data-rst="' + u.uid + '"]'); if (rst) rst.onclick = function () {
          var sug = 'Matriarca' + String(Math.floor(1000 + Math.random() * 9000));
          box.hidden = false;
          box.innerHTML = '\x3cdiv class="g-form g-edit">\x3clabel for="r-pas-' + u.uid + '">Nueva contraseña para ' + esc(u.nombre) + '\x3c/label>\x3cinput id="r-pas-' + u.uid + '" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + sug + '">' +
            '\x3cp class="g-hint">Puede dejar esta o escribir otra (mínimo 6 caracteres). La contraseña anterior deja de servir y la persona deberá cambiarla al entrar.\x3c/p>' +
            '\x3cp class="g-err" id="r-err-' + u.uid + '">\x3c/p>\x3cdiv class="g-ua">\x3cbutton class="g-sm pri" id="r-ok-' + u.uid + '">Restablecer\x3c/button>\x3cbutton class="g-sm" id="r-no-' + u.uid + '">Cancelar\x3c/button>\x3c/div>\x3c/div>';
          $('r-no-' + u.uid).onclick = function () { box.hidden = true; box.innerHTML = ''; };
          $('r-ok-' + u.uid).onclick = function () {
            var np = $('r-pas-' + u.uid).value.trim(), er = $('r-err-' + u.uid), bt = this;
            if (np.length < 6) { er.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
            bt.disabled = true; bt.textContent = 'Guardando…';
            crearCuenta(u.nombre, u.usuario, np, u.rol, u, u.activo)
              .then(function () { modUsuarios('Contraseña de “' + u.usuario + '” restablecida. Nueva contraseña: ' + np + '. Deberá cambiarla al entrar.'); })
              .catch(function (x) { er.textContent = x.msg || errTxt(x); bt.disabled = false; bt.textContent = 'Restablecer'; });
          };

        var del = gate.querySelector('[data-del="' + u.uid + '"]'); if (del) del.onclick = function () {

          };

  }
  // Crea la cuenta con una segunda conexión para no cerrar la sesión del administrador.
  // Si "anterior" viene, es un restablecimiento: se crea una cuenta nueva con el mismo usuario y se desactiva la anterior.
  function crearCuenta(nombre, usuario, clave, rol, anterior, activoNuevo) {
    var loginRef = db.collection('logins').doc(usuario);
    return loginRef.get().then(function (s) {
      if (s.exists && !anterior) throw { msg: 'Ya existe un usuario “' + usuario + '”. Escoja otro.' };
      var n = anterior ? (anterior.version || 1) + 1 : 1;
      var email = usuario + (n > 1 ? '.' + n : '') + '@' + DOMINIO;
      var sec = firebase.initializeApp(cfg, 'alta-' + Date.now());
      return sec.auth().createUserWithEmailAndPassword(email, clave).then(function (cred) {
        var uid = cred.user.uid;
        return sec.auth().signOut().then(function () { return sec.delete(); }).then(function () {
          var batch = db.batch();
          batch.set(db.collection('usuarios').doc(uid), { nombre: nombre, usuario: usuario, email: email, rol: rol, activo: activoNuevo === false ? false : true, debeCambiar: true, version: n, creado: firebase.firestore.FieldValue.serverTimestamp(), creadoPor: auth.currentUser.email });
          batch.set(loginRef, { email: email, uid: uid });
          if (anterior) batch.update(db.collection('usuarios').doc(anterior.uid), { activo: false, reemplazadoPor: uid });
          return batch.commit();
        });
      }, function (x) { sec.delete(); if (/email-already-in-use/.test(x.code || '')) throw { msg: 'Ese usuario ya tuvo una cuenta. Use otro nombre de usuario.' }; throw x; });
    });
  }

  /* ---------- Datos ---------- */
  Object.defineProperty(window, 'MX_USERNAME', { get: function () { return quien(); } });
  window.MX_AUTH = {
    get: function (id) { return db.collection('autorizaciones').doc(id).get().then(function (s) { return s.exists ? s.data() : null; }); },
    save: function (id, data) { if (window.MX_ROLE !== 'admin') return Promise.reject({ code: 'permission-denied' }); return db.collection('autorizaciones').doc(id).set(data); }
  };
  window.MX_SAVE = function (W, archivo) {
    if (!puedeSubir()) return Promise.reject({ code: 'permission-denied' });
    var quienSube = perfil && perfil.nombre ? perfil.nombre : (auth.currentUser ? auth.currentUser.email : '');
    W.cargado = new Date().toISOString(); W.cargadoPor = quienSube; if (archivo) W.archivoNombre = archivo;
    var json = JSON.stringify(W);
    if (json.length > 900000) return Promise.reject({ message: 'El Excel es demasiado grande para guardarlo en un solo registro (' + Math.round(json.length / 1024) + ' KB).' });
    var u = auth.currentUser, now = new Date();
    var rec = { json: json, archivo: archivo || '', por: perfil && perfil.usuario ? perfil.usuario : (u ? u.email : ''), fechaInforme: W.fechaInforme || null, guardado: firebase.firestore.FieldValue.serverTimestamp() };
    var id = now.toISOString().slice(0, 16).replace(/[:T]/g, '-');
    var batch = db.batch();
    batch.set(REF, rec);
    batch.set(db.collection('historial').doc(id), rec);
    return batch.commit();
  };
  function parseFile(file) {
    return new Promise(function (ok, bad) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
          if (!wb.Sheets.BANCOS || !wb.Sheets.PROVEEDORES || !wb.Sheets.INGRESOS) throw new Error('Este archivo no tiene la estructura de Tesorería Integrada (faltan hojas BANCOS, PROVEEDORES o INGRESOS).');
          var get = function (s, a) { var ws = wb.Sheets[s]; if (!ws) return undefined; var c = ws[a]; return c ? c.v : undefined; };
          var maxRow = function (s) { var ws = wb.Sheets[s]; if (!ws || !ws['!ref']) return 0; return XLSX.utils.decode_range(ws['!ref']).e.r + 1; };
          var nw = MX.parse(get, maxRow); nw.archivoNombre = file.name; ok(nw);
        } catch (e) { bad(e); }
      };
      fr.onerror = function () { bad(new Error('No se pudo leer el archivo.')); };
      fr.readAsArrayBuffer(file);
    });
  }
  function primerExcel(err) {
    if (!puedeSubir()) { show('\x3cp class="g-msg">Todavía no hay datos cargados. Cuando el administrador cargue el Excel podrá verlos aquí.\x3c/p>\x3cbutton class="g-link" type="button" id="g-home">‹ Volver al menú\x3c/button>'); $('g-home').onclick = function () { ir('menu'); }; return; }
    show('\x3cp class="g-msg">Todavía no hay datos guardados. Cargue el Excel de Tesorería Integrada para empezar.\x3c/p>' + (err ? '\x3cp class="g-err">' + esc(err) + '\x3c/p>' : '') +
      '\x3clabel class="g-btn" for="g-file">Cargar Excel\x3c/label>\x3cinput id="g-file" type="file" accept=".xlsx,.xlsm,.xls" hidden>\x3cbutton class="g-link" type="button" id="g-home">‹ Volver al menú\x3c/button>');
    $('g-home').onclick = function () { ir('menu'); };
    $('g-file').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      show('\x3cp class="g-msg">Leyendo y guardando ' + esc(f.name) + '…\x3c/p>');
      parseFile(f).then(function (W) { return window.MX_SAVE(W, f.name).then(function () { boot(W); }); })
        .catch(function (er) { primerExcel(er.message || errTxt(er)); });
    };
  }
  function salir() { return '\x3cbutton class="g-link" id="g-out" type="button">Cerrar sesión\x3c/button>'; }
  function bindSalir() { var b = $('g-out'); if (b) b.onclick = function () { auth.signOut().then(function () { location.reload(); }); }; }

  var booted = false;
  function boot(W) {
    if (booted) { location.reload(); return; }
    booted = true;
    window.MX_INITIAL = W;
    window.MX_NAV = function (v) { if (v === 'salir') cerrar(); else if (!v || v === 'menu') ir('menu'); else { history.replaceState({ v: v }, ''); pintar(v); } };
    gate.hidden = true; gate.innerHTML = ''; $('app').hidden = false; window.scrollTo(0, 0);
    new Function(document.getElementById('mx-app').textContent)();
  }
  function abrirCaja(modo) {
    window.MX_MODE = modo || 'caja';
    if (booted) { gate.hidden = true; gate.innerHTML = ''; $('app').hidden = false; window.MX_SETMODE(window.MX_MODE); return; }
    cargarDatos();
  }
  function alertaBreve(m) { var d = document.createElement('div'); d.className = 'g-toast'; d.textContent = m; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3500); }

  /* ---------- Menú principal y navegación ---------- */
  var ICO = {
    egresos: '\x3cpath d="M4 5v14M4 5h16"/>\x3cpath d="M8 9l3.5 4 3-2.5L19 16"/>\x3cpath d="M15 16h4v-4"/>',
    pagar: '\x3cpath d="M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21z"/>\x3cpath d="M10 8h4M10 12h4"/>',
    auth: '\x3cpath d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>\x3cpath d="M8.8 12l2.3 2.3 4.2-4.4"/>',
    prog: '\x3crect x="3.5" y="5" width="17" height="15" rx="2"/>\x3cpath d="M3.5 10h17M8 3v4M16 3v4"/>\x3cpath d="M8.5 15l2.2 2.2 4.3-4.4"/>',
    ventas: '\x3cpath d="M4 19V5M4 19h16"/>\x3cpath d="M8 15l3.5-4 3 2.5L19 8"/>\x3cpath d="M15 8h4v4"/>',
    caja: '\x3cpath d="M3 9.5 12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
    users: '\x3ccircle cx="9" cy="8" r="3.2"/>\x3cpath d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>\x3cpath d="M16 5.2a3 3 0 0 1 0 5.6M18 13.8c1.8.6 3 2.3 3 4.7"/>',
    clave: '\x3crect x="4" y="10" width="16" height="10" rx="2"/>\x3cpath d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2.5"/>',
    salir: '\x3cpath d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/>'
  };
  function icono(k) { return '\x3csvg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICO[k] + '\x3c/svg>'; }
  function quien() { return perfil && perfil.nombre ? perfil.nombre : (auth.currentUser ? auth.currentUser.email : ''); }
  function menu(msg) {
    hideApp(); gate.hidden = false; gate.className = ''; window.scrollTo(0, 0);
    var items = [['caja', 'Flujo de caja', 'Disponible, pagos, cobros, bancos y proyección'], ['ventas', 'Ventas e ingresos', 'Ventas por día y por punto, impoconsumo y otros ingresos'], ['egresos', 'Egresos y gastos', 'Todo lo causado por mes, semana o periodo, pagado y sin pagar'], ['pagar', 'Cuentas por pagar', 'Pendientes por proveedor y por semana, pagas y sin pagar'], ['prog', 'Programación de pagos', 'Lo programado para pagar cada semana, con su detalle'], ['auth', 'Pagos autorizados', 'Autorice los pagos de la semana y genere el informe para imprimir']];
    if (esAdmin()) items.push(['users', 'Administración de usuarios', 'Crear, editar y eliminar usuarios']);
    items.push(['salir', 'Salir', 'Cerrar sesión y volver al ingreso']);
    gate.innerHTML = '\x3cdiv class="scr">\x3cdiv class="scr-in">\x3cdiv class="m-hi">\x3csmall>Bienvenido\x3c/small>\x3cb>' + esc(quien()) + '\x3c/b>\x3cspan>' + esc(ROLES[window.MX_ROLE] || '') + '\x3c/span>\x3c/div>' +
      (msg ? '\x3cp class="g-ok">' + esc(msg) + '\x3c/p>' : '') +
      '\x3cnav class="m-grid">' + items.map(function (it) { return '\x3cbutton class="m-tile' + (it[0] === 'salir' ? ' m-out' : '') + (/^(ventas|egresos|pagar|prog|auth)$/.test(it[0]) ? ' m-main' : '') + '" data-ir="' + it[0] + '">\x3cspan class="m-ic">' + icono(it[0]) + '\x3c/span>\x3cb>' + it[1] + '\x3c/b>\x3csmall>' + it[2] + '\x3c/small>\x3c/button>'; }).join('') + '\x3c/nav>' +
      (esAdmin() ? '' : '\x3cbutton class="g-link" type="button" data-ir="clave">Cambiar mi contraseña\x3c/button>') +
      '\x3cp class="g-ver">Versión ' + esc(window.MX_VERSION || '') + '\x3c/p>\x3c/div>\x3c/div>';
    gate.querySelectorAll('[data-ir]').forEach(function (b) { b.onclick = function () { b.dataset.ir === 'salir' ? cerrar() : ir(b.dataset.ir); }; });
  }
  function barra(titulo, sub) { return '\x3cheader class="g-bar">\x3cbutton class="g-back" id="g-back" aria-label="Volver al menú">‹ Menú\x3c/button>\x3cdiv class="g-bt">\x3csmall>' + esc(sub || 'La Matriarca · Tesorería') + '\x3c/small>\x3cb>' + esc(titulo) + '\x3c/b>\x3c/div>\x3cbutton class="g-exit" id="g-exit">Salir\x3c/button>\x3c/header>'; }
  function bindBarra() { $('g-back').onclick = function () { ir('menu'); }; $('g-exit').onclick = cerrar; }
  function cerrar() { marcar(false); auth.signOut().then(function () { history.replaceState(null, '', location.pathname); location.reload(); }); }
  function pintar(v) {
    if (v === 'caja' || v === 'ventas' || v === 'egresos' || v === 'pagar' || v === 'prog' || v === 'auth') abrirCaja(v);
    else if (v === 'usuarios' && esAdmin()) modUsuarios();
    else if (v === 'clave') { cambiarClave(false, function (m) { ir('menu', m); }); }
    else menu(arguments[1]);
  }
  function ir(v, msg) {
    if (v === 'users') v = 'usuarios';
    if (v === 'menu') { if (history.state && history.state.v && history.state.v !== 'menu') { history.back(); if (msg) setTimeout(function () { menu(msg); }, 60); return; } history.replaceState({ v: 'menu' }, ''); menu(msg); return; }
    history.pushState({ v: v }, '');
    pintar(v);
  }
  window.addEventListener('popstate', function (e) { if (!auth.currentUser || (perfil && perfil.debeCambiar)) return; pintar(e.state && e.state.v || 'menu'); });

  function cargarDatos() {
    show('\x3cp class="g-msg">Cargando datos…\x3c/p>');
    REF.get().then(function (snap) {
      if (snap.exists && snap.data().json) boot(JSON.parse(snap.data().json));
      else primerExcel();
    }).catch(function (er) {
      show('\x3cp class="g-err">' + (er.code === 'permission-denied' ? 'Su usuario no tiene permiso para ver estos datos. Pida al administrador que lo active.' : 'No se pudieron cargar los datos: ' + esc(er.message || er.code)) + '\x3c/p>\x3cbutton class="g-link" type="button" id="g-home">‹ Volver al menú\x3c/button>' + salir()); $('g-home').onclick = function () { ir('menu'); };
      bindSalir();
    });
  }

  function inicio() { history.replaceState({ v: 'menu' }, ''); menu(); }

  show('\x3cp class="g-msg">Cargando…\x3c/p>');
  auth.onAuthStateChanged(function (u) {
    if (u && !abierta) { auth.signOut(); return; } // cada vez que se abre la app pide usuario y contraseña
    if (!u) { if (booted) location.reload(); else loginForm(); return; }
    if (booted) return;
    show('\x3cp class="g-msg">Cargando…\x3c/p>');
    db.collection('usuarios').doc(u.uid).get().then(function (s) {
      perfil = s.exists ? s.data() : null;
      if (u.email === ADMIN_EMAIL) {
        window.MX_ROLE = 'admin';
        if (!perfil) { // primera vez del administrador: le crea el usuario "guillermo"
          perfil = { nombre: 'Guillermo Fontalvo', usuario: 'guillermo', email: u.email, rol: 'admin', activo: true, debeCambiar: false, version: 1 };
          return db.collection('logins').doc('guillermo').get().then(function (l) {
            var b = db.batch();
            b.set(db.collection('usuarios').doc(u.uid), Object.assign({ creado: firebase.firestore.FieldValue.serverTimestamp() }, perfil));
            if (!l.exists) b.set(db.collection('logins').doc('guillermo'), { email: u.email, uid: u.uid });
            return b.commit();
          }).then(inicio, inicio);
        }
        return inicio();
      }
      if (!perfil || !perfil.activo) { show('\x3cp class="g-err">Su usuario está desactivado o no tiene acceso. Hable con el administrador.\x3c/p>' + salir()); bindSalir(); return; }
      window.MX_ROLE = perfil.rol;
      if (perfil.debeCambiar) return cambiarClave(true);
      inicio();
    }).catch(function (er) { show('\x3cp class="g-err">' + esc(errTxt(er)) + '\x3c/p>' + salir()); bindSalir(); });
  });
})();
</script>
</body>
