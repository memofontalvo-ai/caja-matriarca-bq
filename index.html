.cprow .ck-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.cp-a{display:flex;flex-direction:column;align-items:flex-end;gap:3px;white-space:nowrap}
.cp-a em{font-style:normal;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:#f9d6d1;color:#8e2a20}
.st-pagado .cp-a em{background:#cfe8da;color:#14573a}
.st-parcial .cp-a em{background:#fbe8bd;color:#7a5410}
.party .tot.cp-ok{color:#1f7a4d} .party .tot.cp-fa{color:#b03a2e}
.party.apf[open]>summary .tot.cp-ok,.party.apf[open]>summary .tot.cp-fa{color:var(--accent-ink)}
.cpsum{display:block!important}
.cpsum .card-t{margin-bottom:6px}
.cp-kv{margin:8px 0 0;padding:0;display:grid;gap:6px}
.cp-kv>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.cp-kv dt{font-size:14px;font-weight:600;color:var(--muted);margin:0}
.cp-kv dd{margin:0;font-size:18px;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cp-kv .ok dd{color:#1f7a4d} .cp-kv .fa dd{color:#b03a2e}
.party>summary .cp-kvp{grid-column:1 / -1;margin-top:4px}
.party>summary .cp-kvp>div{border-top:1px solid rgba(255,255,255,.25);padding:4px 0}
.party:not([open])>summary .cp-kvp>div{border-top-color:var(--line)}
.party:not([open])>summary .cp-kvp dt{color:var(--muted)}
.party[open]>summary .cp-kvp dt,.party[open]>summary .cp-kvp dd{color:var(--accent-ink)!important}
.party>summary .cp-kvp dd{font-size:15px}
.cp-bt{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.cp-bt .btn{flex:1 1 150px}
/* v7.0 programaciones por semana */
.ppbar{margin:8px 0 10px}.ppbar>small{display:block;font-weight:700;color:#4a554e;margin-bottom:6px}
.ppch{display:flex;flex-wrap:wrap;gap:8px}
.ppc{flex:1 1 150px;min-width:140px;text-align:left;background:#fff;border:1.5px solid #d6dbd3;border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;font:inherit;color:#14231B;cursor:pointer}
.ppc b{font-size:14px}.ppc span{font-size:13px;color:#33423a}.ppc small{font-size:11.5px;color:#6b756e}
.ppc.on{border-color:#173D30;background:#EAF3EC;box-shadow:0 0 0 2px #173D3022}
.ppc.nueva{border-style:dashed;justify-content:center}

.scr{min-height:100vh;min-height:100dvh;background:var(--deep) var(--fondo-img) no-repeat top center/min(100%,520px) auto;display:flex;justify-content:center}
.scr-in{width:100%;max-width:520px;padding:calc(min(100vw,520px) * .9) 18px 40px;display:grid;gap:14px;align-content:start}
.g-card{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:22px 20px;display:grid;gap:14px;color:var(--cream);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.g-h{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:.02em;color:var(--cream)}
.g-form{display:grid;gap:8px}
.g-form label{font-size:13px;font-weight:600;color:var(--gold-soft);margin-top:4px;letter-spacing:.02em}
.g-form input,.g-form select{border:1px solid var(--glass-line);border-radius:12px;padding:12px 13px;background:rgba(255,255,255,.94);color:#14231B;font-size:16px}
.g-form input:focus,.g-form select:focus{outline:2px solid var(--gold);outline-offset:1px}
.g-btn{display:block;text-align:center;border:0;border-radius:12px;padding:13px;background:linear-gradient(180deg,#D8B56B,#B88E43);color:#1D1608;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;letter-spacing:.02em}
.g-btn:disabled{opacity:.6}
.g-msg{margin:0;color:var(--cream);opacity:.9}
.g-err{margin:0;color:#FFB4A8;font-weight:600}
.g-err:empty{display:none}
.g-link{border:0;background:none;color:var(--gold-soft);font-weight:600;padding:4px 0;cursor:pointer;justify-self:center}
.g-ver{margin:0;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(228,204,147,.6)}
.g-ok{margin:0;background:rgba(108,203,149,.16);color:#BDEBCF;border:1px solid rgba(108,203,149,.35);border-radius:12px;padding:10px 12px;font-weight:600}
/* Menú */
.m-hi{display:grid;gap:2px;color:var(--cream);text-align:center}
.m-hi small{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
.m-hi b{font-size:22px;font-weight:800}
.m-hi span{font-size:13px;color:rgba(244,236,218,.7)}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.m-tile{display:grid;gap:6px;justify-items:start;text-align:left;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:16px 14px;color:var(--cream);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:132px;transition:transform .15s,border-color .15s}
.m-tile:hover{border-color:var(--gold);transform:translateY(-1px)}
.m-tile b{font-size:16px;font-weight:800}
.m-tile small{font-size:12.5px;color:rgba(244,236,218,.72);line-height:1.35}
.m-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(201,163,90,.16);color:var(--gold-soft)}
.m-tile:first-child{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;column-gap:14px;padding:18px 16px;border-color:var(--gold)}
.m-tile:first-child .m-ic{grid-row:span 2;width:52px;height:52px;background:linear-gradient(180deg,#D8B56B,#B88E43);color:#1D1608}
.m-tile:first-child b{font-size:19px}
.m-out .m-ic{background:rgba(255,180,168,.12);color:#FFB4A8}
/* Paneles internos (usuarios) */
#gate.g-full{background:var(--bg)}
.g-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bar);color:var(--bar-ink)}
.g-back{flex:none;border:0;background:rgba(255,255,255,.12);color:var(--bar-ink);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer}
.g-bt{flex:1;min-width:0;display:grid}.g-bt small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted)}.g-bt b{font-size:19px;font-weight:800}
.g-exit{flex:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--bar-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.g-panel{max-width:720px;margin:0 auto;padding:18px 16px 48px;display:grid;gap:16px}
.g-panel .g-ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.g-panel .g-err{color:var(--bad)}
.g-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:8px;color:var(--ink)}
.g-box h3{margin:0 0 4px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
.g-panel .g-form label{color:var(--muted)}
.g-panel .g-form input,.g-panel .g-form select{border-color:var(--line);background:var(--bg);color:var(--ink)}
.g-panel .g-btn{background:var(--accent);color:var(--accent-ink)}
.g-hint{margin:2px 0 0;font-size:13px;color:var(--muted)}
.g-panel .g-msg{color:var(--muted)}
.g-u{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.g-u:first-child{border-top:0}
.g-u.off .g-ui{opacity:.55}
.g-ui{display:grid;gap:2px;min-width:0}.g-ui span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.g-ui code{font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:5px;color:var(--ink)}
.g-ua{display:flex;flex-wrap:wrap;gap:8px}
.g-ua select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font-size:14px;color:var(--ink)}
.g-sm{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;cursor:pointer}
.g-sm.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.g-rs{display:grid;gap:6px}.g-rs label{font-size:13px;color:var(--muted)}
.g-row{display:flex;gap:8px}.g-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:16px;color:var(--ink)}
.g-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}
@media (prefers-reduced-motion:reduce){.m-tile{transition:none}}
.m-out{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;padding:12px 14px}
.m-out .m-ic{grid-row:span 2;width:38px;height:38px}
.m-out b{font-size:15px}
.g-del{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.g-sm.g-del:hover{background:var(--bad-bg)}
.g-warn{margin:0;font-size:14px;color:var(--ink);background:var(--bad-bg);border-radius:8px;padding:10px 12px}
.g-edit{background:var(--sunk);border-radius:10px;padding:12px}
.g-panel .g-form input:disabled{opacity:.6}
.m-grid .m-tile:not(.m-out){grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;column-gap:14px}
.m-grid .m-tile:not(.m-out) .m-ic{grid-row:span 2}
.m-grid .m-main{border-color:var(--gold)}
.m-grid .m-main .m-ic{width:48px;height:48px;background:linear-gradient(180deg,#D8B56B,#B88E43);color:#1D1608}
.m-grid .m-main b{font-size:18px}

.g-pw{position:relative;display:block}
.g-pw input{width:100%;padding-right:48px !important}
.g-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:#5B6760;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.g-eye:hover{color:#14231B;background:rgba(0,0,0,.05)}
.g-panel .g-eye{color:var(--muted)}

.scr-in{gap:12px}

.m-grid .m-tile:not(.m-out){padding:14px}
.m-tile:first-child .m-ic{width:48px;height:48px}
.m-tile:first-child b{font-size:18px}
.scr-in{gap:10px}.m-grid{gap:10px}

/* v4.6 módulos por usuario */
.g-mods{display:grid;gap:6px;margin:4px 0 6px}
.g-mod{display:flex!important;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0!important;color:var(--ink)!important;font-size:15px!important;font-weight:600;cursor:pointer}
.g-mod input{width:22px;height:22px;flex:none;accent-color:#1f7a4d;margin:0}

/* v4.7 Pantalla inicial (menú): encabezado compacto, fondo verde salvia y botones con relieve.
   Todo va dentro de .scr-menu para no afectar el ingreso ni las pantallas internas. */
.scr.scr-menu{display:block;background:#B6C8AF;--hw:min(100vw,440px)}
.scr-menu .mh{background:#0D3123;position:relative;box-shadow:0 4px 10px rgba(5,40,28,.35);z-index:2}
.scr-menu .mh-img{position:relative;width:var(--hw);height:calc(var(--hw) * .79);margin:0 auto;padding:0;
  background:var(--fondo-img) no-repeat;background-size:100% auto;background-position:0 calc(var(--hw) * -.108)}
.scr-menu .mh-img::before,.scr-menu .mh-img::after{content:'';position:absolute;pointer-events:none}
.scr-menu .mh-img::before{inset:0;background:
  linear-gradient(90deg,#0D3123 0,rgba(13,49,35,0) 4%,rgba(13,49,35,0) 96%,#0D3123 100%),
  linear-gradient(180deg,#0D3123 0,rgba(13,49,35,0) 5%,rgba(13,49,35,0) 94%,#0D3123 100%)}
.scr-menu .mh-body{position:relative;isolation:isolate;min-height:calc(100dvh - var(--hw) * .79)}
.scr-menu .mh-body::before{content:'';position:absolute;inset:0;z-index:-1;background:

<script id="mx-engine">/* Motor de flujo de caja La Matriarca: lee el Excel "Tesorería Integrada" y replica sus cálculos. */
var MX = (function () {
  function colIdx(L) { var n = 0; for (var i = 0; i < L.length; i++) n = n * 26 + (L.charCodeAt(i) - 64); return n; }
  function colName(n) { var s = ''; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function num(v) { if (typeof v === 'number' && isFinite(v)) return v; if (typeof v === 'string') { var t = v.replace(/[$\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'); var n = parseFloat(t); return isFinite(n) ? n : 0; } return 0; }
  function str(v) { return v == null ? '' : String(v).trim(); }
  function dte(v) {
    if (typeof v === 'number' && v > 20000 && v < 80000) return Math.floor(v);
    if (typeof v === 'string') {
      var m = v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
      if (m) { var y = +m[3]; if (y < 100) y += 2000; return Math.round((Date.UTC(y, +m[2] - 1, +m[1]) - Date.UTC(1899, 11, 30)) / 864e5); }
      m = v.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 864e5);
    }
    return null;
  }
  function eq(a, b) { return str(a).toLowerCase() === str(b).toLowerCase(); }

  // get(sheet, "A1") -> valor en caché; maxRow(sheet)
  function parse(get, maxRow) {
    var W = {};
    function rows(sheet, from, to, fn) { var mr = Math.min(to, maxRow(sheet) || to); for (var r = from; r <= mr; r++) fn(function (L) { return get(sheet, L + r); }, r); }
    // Cuentas
    var accounts = [];
    for (var r = 7; r <= 16; r++) { var n = str(get('BANCOS', 'A' + r)); if (n) accounts.push({ name: n, type: str(get('BANCOS', 'B' + r)) || 'Banco', ini: num(get('BANCOS', 'C' + r)) }); }
    W.accounts = accounts;
    W.inicio = dte(get('BANCOS', 'B2'));
    W.transfers = [];
    rows('BANCOS', 34, 101, function (g) { var f = dte(g('A')); var v = num(g('D')); if (f && v) W.transfers.push({ f: f, de: str(g('B')), a: str(g('C')), v: v, obs: str(g('E')) }); });
    // Saldos reales (fila 107 encabezados)
    var hdr = [];
    for (var c = 2; c <= 12; c++) { var h = str(get('BANCOS', colName(c) + '107')); if (!h) break; hdr.push({ col: colName(c), name: h.replace(/\s*\(auto\)\s*/i, '').trim(), auto: /\(auto\)/i.test(h) }); }
    W.realCols = hdr.map(function (h) { return { name: h.name, auto: h.auto }; });
    W.real = [];
    rows('BANCOS', 108, 400, function (g) { var f = dte(g('A')); if (!f) return; W.real.push({ f: f, v: hdr.map(function (h) { return num(g(h.col)); }) }); });
    // Anexos de pagos
    W.pay = [];
    function pushPay(o) { if (!o.tercero && !o.valor && !o.pagado) return; W.pay.push(o); }
    W.vencProv = /vencim/i.test(str(get('PROVEEDORES', 'Z4')));
    rows('PROVEEDORES', 5, 5000, function (g, r) { pushPay({ cat: 'prov', row: r, fDoc: dte(g('A')), fProg: dte(g('B')), fPago: dte(g('C')), venc: W.vencProv ? dte(g('Z')) : null, plazo: W.vencProv ? num(g('Y')) : 0, tercero: str(g('D')), nit: str(g('E')), factura: str(g('I')), concepto: str(g('J')), sub: str(g('L')), tipo: str(g('K')), valor: num(g('S')), pagado: num(g('T')), banco: str(g('U')), obs: str(g('V')), punto: str(g('W')), saldo: num(g('X')) }); });
    rows('SERVICIOS', 5, 5000, function (g, r) { pushPay({ cat: 'serv', row: r, fDoc: dte(g('A')), fProg: dte(g('B')), fPago: dte(g('C')), tercero: str(g('E')), sub: str(g('D')), concepto: str(g('F')), venc: dte(g('G')), banco: str(g('H')), valor: num(g('O')), pagado: num(g('P')), obs: str(g('Q')), factura: str(g('R')), punto: str(g('S')), saldo: num(g('T')) }); });
    rows('PERSONAL', 5, 5000, function (g, r) { pushPay({ cat: 'pers', row: r, fProg: dte(g('A')), fPago: dte(g('B')), sub: str(g('C')), tercero: str(g('D')), concepto: str(g('F')), factura: str(g('G')), banco: str(g('H')), valor: num(g('I')), pagado: num(g('J')), obs: str(g('K')), punto: str(g('L')), saldo: num(g('M')) }); });
    rows('GASTOS_VARIOS', 5, 5000, function (g, r) { pushPay({ cat: 'gast', row: r, fProg: dte(g('A')), fPago: dte(g('B')), sub: str(g('C')), tercero: str(g('D')), concepto: str(g('E')), factura: str(g('F')), banco: str(g('G')), valor: num(g('H')), pagado: num(g('I')), obs: str(g('J')), punto: str(g('K')), saldo: num(g('L')) }); });
    // OBLIGACIONES_FINANCIERAS: una fila por cuota; se programa el 1er día hábil del mes (col. Q) y sigue pendiente hasta que tenga fecha de pago (col. J)
    W.hojaObl = maxRow('OBLIGACIONES_FINANCIERAS') > 0 && /obligaciones/i.test(str(get('OBLIGACIONES_FINANCIERAS', 'A1')));
    W.oblResumen = [];
    if (W.hojaObl) {
      var prod = {};
      for (var orr = 8; orr <= 12; orr++) { var on = str(get('OBLIGACIONES_FINANCIERAS', 'A' + orr)); if (on) { prod[on] = str(get('OBLIGACIONES_FINANCIERAS', 'C' + orr)); W.oblResumen.push({ n: on, ent: str(get('OBLIGACIONES_FINANCIERAS', 'B' + orr)), prod: prod[on], saldoCap: num(get('OBLIGACIONES_FINANCIERAS', 'O' + orr)), prox: num(get('OBLIGACIONES_FINANCIERAS', 'R' + orr)), fProx: dte(get('OBLIGACIONES_FINANCIERAS', 'Q' + orr)), pend: num(get('OBLIGACIONES_FINANCIERAS', 'U' + orr)) }); } }
      var baseO = dte(get('DISPONIBLE REAL', 'C5')) || dte(get('OBLIGACIONES_FINANCIERAS', 'B4')) || 0;
      W.oblHorizonte = 30;
      rows('OBLIGACIONES_FINANCIERAS', 26, 275, function (g, r) {
        var n = str(g('A')); if (!n) return;
        var cuota = num(g('C')), total = num(g('I')), fPago = dte(g('J')), fProg = dte(g('Q')), fVence = dte(g('D'));
        // las cuotas futuras (proyectadas) se cargan solo hasta 30 días después de la fecha del informe, igual que el Excel
        if (!fPago && baseO && fProg && fProg > baseO + W.oblHorizonte + 5) return;
        W.pay.push({ cat: 'obl', row: r, fDoc: fVence, fProg: fProg, fPago: fPago, venc: fVence, plazo: 0, tercero: str(g('B')), nit: n, factura: n, concepto: 'Cuota ' + cuota + ' · ' + n, sub: prod[n] || 'Obligación financiera', tipo: '', valor: total, pagado: fPago ? num(g('K')) : 0, banco: str(g('L')), obs: str(g('P')), punto: '', saldo: fPago ? 0 : total, cuota: cuota, capital: num(g('F')), interes: num(g('G')), otros: num(g('H')), estimada: /proyectad|estimad/i.test(str(g('P'))) });
      });
    }
    W.pay.forEach(function (p) { if (!p.fDoc) p.fDoc = p.fProg || p.fPago; });
    // Ingresos
    W.ing = [];
    // Columnas opcionales en INGRESOS (fila 4): "ICO"/"Impoconsumo", "Propina", "Venta neta"
    var optIco = null, optProp = null, optNeta = null;
    for (var oc = 10; oc <= 30; oc++) { var oh = str(get('INGRESOS', colName(oc) + '4')).toLowerCase(); if (!oh) continue; if (/propina/.test(oh)) optProp = colName(oc); else if (/neta|base|sin imp/.test(oh)) optNeta = colName(oc); else if (/\bico\b|impoconsumo|impuesto/.test(oh)) optIco = colName(oc); }
    W.ingCols = { ico: !!optIco, prop: !!optProp, neta: !!optNeta };
    rows('INGRESOS', 5, 5000, function (g) { var f = dte(g('A')); var v = num(g('G')); if (!f || !v) return; var o = { f: f, tipo: str(g('B')), cliente: str(g('C')), desc: str(g('D')), medio: str(g('E')), banco: str(g('F')), v: v, obs: str(g('H')), punto: str(g('I')) };
      if (optIco) o.ico = num(g(optIco)); if (optProp) o.prop = num(g(optProp)); if (optNeta) o.neta = num(g(optNeta)); W.ing.push(o); });
    // CxC manual
    W.cxc = [];
    rows('CXC', 3, 400, function (g) { var f = dte(g('A')); if (!f) return; W.cxc.push({ f: f, emp: num(g('B')), soc: num(g('C')), otr: num(g('D')) }); });
    // MEGAMAS
    W.megaIni = num(get('CUENTAS_POR_COBRAR', 'E3'));
    W.mega = [];
    rows('CUENTAS_POR_COBRAR', 5, 3000, function (g) { var f = dte(g('A')); var v = num(g('H')); if (!f || !v) return; W.mega.push({ f: f, ent: str(g('B')), tipo: str(g('C')), benef: str(g('D')), factura: str(g('E')), concepto: str(g('F')), banco: str(g('G')), v: v }); });
    // Manuales
    // DISPONIBLE REAL: se lee por el nombre de cada renglón (columna B), no por celda fija,
    // para que siga funcionando si el contador agrega o mueve filas.
    var DR = [];
    for (var dr = 1; dr <= 60; dr++) { var lb = str(get('DISPONIBLE REAL', 'B' + dr)); if (lb) DR.push({ r: dr, lbl: lb, key: lb.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''), v: num(get('DISPONIBLE REAL', 'E' + dr)) }); }
    function drFind(re) { for (var i = 0; i < DR.length; i++) if (re.test(DR[i].key)) return DR[i]; return null; }
    function drVal(re) { var x = drFind(re); return x ? x.v : 0; }
    var fRow = drFind(/^fecha del informe/);
    W.fechaInforme = dte(get('DISPONIBLE REAL', 'C' + (fRow ? fRow.r : 5)));

              if (!np) return;
              return crearCuenta(nom, u.usuario, np, rol, Object.assign({}, u, { nombre: nom, rol: rol, modulos: mods }), act, mods);
            }).then(function () { modUsuarios('Usuario “' + u.usuario + '” actualizado.' + (np ? ' Contraseña nueva: ' + np + ' (la deberá cambiar al entrar).' : '')); })
              .catch(function (x) { er.textContent = x.msg || errTxt(x); var b = $('e-ok-' + u.uid); if (b) { b.disabled = false; b.textContent = 'Guardar cambios'; } });
          };
        };
        var rst = gate.querySelector('[data-rst="' + u.uid + '"]'); if (rst) rst.onclick = function () {
          var sug = 'Matriarca' + String(Math.floor(1000 + Math.random() * 9000));
          box.hidden = false;
          box.innerHTML = '\x3cdiv class="g-form g-edit">\x3clabel for="r-pas-' + u.uid + '">Nueva contraseña para ' + esc(u.nombre) + '\x3c/label>\x3cinput id="r-pas-' + u.uid + '" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + sug + '">' +
            '\x3cp class="g-hint">Puede dejar esta o escribir otra (mínimo 6 caracteres). La contraseña anterior deja de servir y la persona deberá cambiarla al entrar.\x3c/p>' +
            '\x3cp class="g-err" id="r-err-' + u.uid + '">\x3c/p>\x3cdiv class="g-ua">\x3cbutton class="g-sm pri" id="r-ok-' + u.uid + '">Restablecer\x3c/button>\x3cbutton class="g-sm" id="r-no-' + u.uid + '">Cancelar\x3c/button>\x3c/div>\x3c/div>';
          $('r-no-' + u.uid).onclick = function () { box.hidden = true; box.innerHTML = ''; };
          $('r-ok-' + u.uid).onclick = function () {
            var np = $('r-pas-' + u.uid).value.trim(), er = $('r-err-' + u.uid), bt = this;
            if (np.length < 6) { er.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
            bt.disabled = true; bt.textContent = 'Guardando…';
            crearCuenta(u.nombre, u.usuario, np, u.rol, u, u.activo)
              .then(function () { modUsuarios('Contraseña de “' + u.usuario + '” restablecida. Nueva contraseña: ' + np + '. Deberá cambiarla al entrar.'); })
              .catch(function (x) { er.textContent = x.msg || errTxt(x); bt.disabled = false; bt.textContent = 'Restablecer'; });
          };
        };
        var del = gate.querySelector('[data-del="' + u.uid + '"]'); if (del) del.onclick = function () {
          box.hidden = false;
          box.innerHTML = '\x3cp class="g-warn">¿Eliminar a \x3cb>' + esc(u.nombre) + '\x3c/b> (' + esc(u.usuario) + ')? Ya no podrá entrar a la aplicación.\x3c/p>\x3cdiv class="g-ua">\x3cbutton class="g-sm g-del" id="d-ok-' + u.uid + '">Sí, eliminar\x3c/button>\x3cbutton class="g-sm" id="d-no-' + u.uid + '">Cancelar\x3c/button>\x3c/div>';
          $('d-no-' + u.uid).onclick = function () { box.hidden = true; box.innerHTML = ''; };
          $('d-ok-' + u.uid).onclick = function () {
            this.disabled = true;
            var lref = db.collection('logins').doc(u.usuario);
            lref.get().then(function (l) {
              var bt = db.batch();
              bt.delete(db.collection('usuarios').doc(u.uid));
              if (l.exists && l.data().uid === u.uid) bt.delete(lref);
              return bt.commit();
            }).then(function () { modUsuarios('Usuario “' + u.usuario + '” eliminado.'); }).catch(function (x) { modUsuarios(errTxt(x)); });
          };
        };
      });
    }).catch(function (x) { $('g-list').innerHTML = '\x3cp class="g-err">' + esc(errTxt(x)) + '\x3c/p>'; });
  }
  // Crea la cuenta con una segunda conexión para no cerrar la sesión del administrador.
  // Si "anterior" viene, es un restablecimiento: se crea una cuenta nueva con el mismo usuario y se desactiva la anterior.
  function crearCuenta(nombre, usuario, clave, rol, anterior, activoNuevo, mods) {
    var loginRef = db.collection('logins').doc(usuario);
    return loginRef.get().then(function (s) {
      if (s.exists && !anterior) throw { msg: 'Ya existe un usuario “' + usuario + '”. Escoja otro.' };
      var n = anterior ? (anterior.version || 1) + 1 : 1;
      var email = usuario + (n > 1 ? '.' + n : '') + '@' + DOMINIO;
      var sec = firebase.initializeApp(cfg, 'alta-' + Date.now());
      return sec.auth().createUserWithEmailAndPassword(email, clave).then(function (cred) {
        var uid = cred.user.uid;
        return sec.auth().signOut().then(function () { return sec.delete(); }).then(function () {
          var batch = db.batch();
          batch.set(db.collection('usuarios').doc(uid), { nombre: nombre, usuario: usuario, email: email, rol: rol, modulos: mods !== undefined ? mods : (anterior && Array.isArray(anterior.modulos) ? anterior.modulos : null), activo: activoNuevo === false ? false : true, debeCambiar: true, version: n, creado: firebase.firestore.FieldValue.serverTimestamp(), creadoPor: auth.currentUser.email });
          batch.set(loginRef, { email: email, uid: uid });
          if (anterior) batch.update(db.collection('usuarios').doc(anterior.uid), { activo: false, reemplazadoPor: uid });
          return batch.commit();
        });
      }, function (x) { sec.delete(); if (/email-already-in-use/.test(x.code || '')) throw { msg: 'Ese usuario ya tuvo una cuenta. Use otro nombre de usuario.' }; throw x; });
    });
  }

  /* ---------- Datos ---------- */
  Object.defineProperty(window, 'MX_USERNAME', { get: function () { return quien(); } });
  window.MX_AUTH = {
    get: function (id) { return db.collection('autorizaciones').doc(id).get().then(function (s) { return s.exists ? s.data() : null; }); },
    save: function (id, data) { if (window.MX_ROLE !== 'admin') return Promise.reject({ code: 'permission-denied' }); return db.collection('autorizaciones').doc(id).set(data); },
    del: function (id) { if (window.MX_ROLE !== 'admin') return Promise.reject({ code: 'permission-denied' }); return db.collection('autorizaciones').doc(id).delete(); }
  };
  /* v6.1 Copia del Excel original (archivo .xlsx) en pedazos dentro de 'tesoreria', para poder entregarlo con los pagos aplicados */
  var XCH = 600000;
  function aB64(buf) { var u = new Uint8Array(buf), s = '', i, st = 0x8000; for (i = 0; i < u.length; i += st) s += String.fromCharCode.apply(null, u.subarray(i, i + st)); return btoa(s); }
  function deB64(str) { var b = atob(str), u = new Uint8Array(b.length), i; for (i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }
  window.MX_XLS = {
    save: function (buf, nombre, cargado) {
      if (!puedeSubir()) return Promise.reject({ code: 'permission-denied' });
      var s = aB64(buf), n = Math.ceil(s.length / XCH), b = db.batch(), k;
      for (k = 0; k < n; k++) b.set(db.collection('tesoreria').doc('xlsx_' + k), { k: k, d: s.slice(k * XCH, (k + 1) * XCH) });
      b.set(db.collection('tesoreria').doc('xlsx_meta'), { n: n, nombre: nombre || '', cargado: cargado || '', bytes: buf.byteLength, guardado: firebase.firestore.FieldValue.serverTimestamp() });
      return b.commit();
    },
    load: function () {
      return db.collection('tesoreria').doc('xlsx_meta').get().then(function (m) {
        if (!m.exists) return null;
        var d = m.data(), ps = [], k;
        for (k = 0; k < d.n; k++) ps.push(db.collection('tesoreria').doc('xlsx_' + k).get());
        return Promise.all(ps).then(function (a) {
          var s = '';
          for (k = 0; k < a.length; k++) { if (!a[k].exists) return null; s += a[k].data().d; }
          return { name: d.nombre, cargado: d.cargado, buf: deB64(s) };
        });
      });
    }
  };
  window.MX_SAVE = function (W, archivo, bufNuevo) {
    if (!puedeSubir()) return Promise.reject({ code: 'permission-denied' });
    var quienSube = perfil && perfil.nombre ? perfil.nombre : (auth.currentUser ? auth.currentUser.email : '');
    W.cargado = new Date().toISOString(); W.cargadoPor = quienSube; if (archivo) W.archivoNombre = archivo;
    var json = JSON.stringify(W);
    if (json.length > 900000) return Promise.reject({ message: 'El Excel es demasiado grande para guardarlo en un solo registro (' + Math.round(json.length / 1024) + ' KB).' });
    var u = auth.currentUser, now = new Date();
    var rec = { json: json, archivo: archivo || '', por: perfil && perfil.usuario ? perfil.usuario : (u ? u.email : ''), fechaInforme: W.fechaInforme || null, guardado: firebase.firestore.FieldValue.serverTimestamp() };
    var id = now.toISOString().slice(0, 16).replace(/[:T]/g, '-');
    var batch = db.batch();
    batch.set(REF, rec);
    batch.set(db.collection('historial').doc(id), rec);
    var bytes = bufNuevo || (window.MX_LASTXLS && window.MX_LASTXLS.name === archivo ? window.MX_LASTXLS.buf : null), cargado = W.cargado;
    return batch.commit().then(function () {
      if (!bytes) return null;
      return window.MX_XLS.save(bytes, archivo, cargado).catch(function (e) { try { console.warn('No se pudo guardar la copia del archivo Excel', e); } catch (x) {} });
    });
  };
  function parseFile(file) {
    return new Promise(function (ok, bad) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
          if (!wb.Sheets.BANCOS || !wb.Sheets.PROVEEDORES || !wb.Sheets.INGRESOS) throw new Error('Este archivo no tiene la estructura de Tesorería Integrada (faltan hojas BANCOS, PROVEEDORES o INGRESOS).');
          var get = function (s, a) { var ws = wb.Sheets[s]; if (!ws) return undefined; var c = ws[a]; return c ? c.v : undefined; };
          var maxRow = function (s) { var ws = wb.Sheets[s]; if (!ws || !ws['!ref']) return 0; return XLSX.utils.decode_range(ws['!ref']).e.r + 1; };
          var nw = MX.parse(get, maxRow); nw.archivoNombre = file.name; window.MX_LASTXLS = { name: file.name, buf: fr.result }; ok(nw);
        } catch (e) { bad(e); }
      };
      fr.onerror = function () { bad(new Error('No se pudo leer el archivo.')); };
      fr.readAsArrayBuffer(file);
    });
  }
  function primerExcel(err) {
    if (!puedeSubir()) { show('\x3cp class="g-msg">Todavía no hay datos cargados. Cuando el administrador cargue el Excel podrá verlos aquí.\x3c/p>\x3cbutton class="g-link" type="button" id="g-home">‹ Volver al menú\x3c/button>'); $('g-home').onclick = function () { ir('menu'); }; return; }
    show('\x3cp class="g-msg">Todavía no hay datos guardados. Cargue el Excel de Tesorería Integrada para empezar.\x3c/p>' + (err ? '\x3cp class="g-err">' + esc(err) + '\x3c/p>' : '') +
      '\x3clabel class="g-btn" for="g-file">Cargar Excel\x3c/label>\x3cinput id="g-file" type="file" accept=".xlsx,.xlsm,.xls" hidden>\x3cbutton class="g-link" type="button" id="g-home">‹ Volver al menú\x3c/button>');
    $('g-home').onclick = function () { ir('menu'); };
    $('g-file').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      show('\x3cp class="g-msg">Leyendo y guardando ' + esc(f.name) + '…\x3c/p>');
      parseFile(f).then(function (W) { return window.MX_SAVE(W, f.name).then(function () { boot(W); }); })
        .catch(function (er) { primerExcel(er.message || errTxt(er)); });
    };
  }
  function salir() { return '\x3cbutton class="g-link" id="g-out" type="button">Cerrar sesión\x3c/button>'; }
  function bindSalir() { var b = $('g-out'); if (b) b.onclick = function () { auth.signOut().then(function () { location.reload(); }); }; }

  var booted = false;
  function boot(W) {
    if (booted) { location.reload(); return; }
    booted = true;
    window.MX_INITIAL = W;
    window.MX_NAV = function (v) { if (v === 'salir') cerrar(); else if (!v || v === 'menu') ir('menu'); else { history.replaceState({ v: v }, ''); pintar(v); } };
    gate.hidden = true; gate.innerHTML = ''; $('app').hidden = false; window.scrollTo(0, 0);
    new Function(document.getElementById('mx-app').textContent)();
  }
  function abrirCaja(modo) {
    window.MX_MODE = modo || 'caja';
    if (booted) { gate.hidden = true; gate.innerHTML = ''; $('app').hidden = false; window.MX_SETMODE(window.MX_MODE); return; }
    cargarDatos();
  }
  function alertaBreve(m) { var d = document.createElement('div'); d.className = 'g-toast'; d.textContent = m; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3500); }

  /* ---------- Menú principal y navegación ---------- */
  var ICO = {
    egresos: '\x3cpath d="M4 5v14M4 5h16"/>\x3cpath d="M8 9l3.5 4 3-2.5L19 16"/>\x3cpath d="M15 16h4v-4"/>',
    pagar: '\x3cpath d="M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21z"/>\x3cpath d="M10 8h4M10 12h4"/>',
    comp: '\x3cpath d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>\x3cpath d="M13 7l2.5 2.5L20 5"/>',
    aplic: '\x3crect x="4" y="3.5" width="16" height="17" rx="2"/>\x3cpath d="M8 8.5h8M8 12h5"/>\x3cpath d="M9 16.5l2 2 4-4.2"/>',
    auth: '\x3cpath d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>\x3cpath d="M8.8 12l2.3 2.3 4.2-4.4"/>',
    prog: '\x3crect x="3.5" y="5" width="17" height="15" rx="2"/>\x3cpath d="M3.5 10h17M8 3v4M16 3v4"/>\x3cpath d="M8.5 15l2.2 2.2 4.3-4.4"/>',
    ventas: '\x3cpath d="M4 19V5M4 19h16"/>\x3cpath d="M8 15l3.5-4 3 2.5L19 8"/>\x3cpath d="M15 8h4v4"/>',
    disp: '\x3crect x="3" y="6" width="18" height="12" rx="2"/>\x3ccircle cx="12" cy="12" r="2.6"/>\x3cpath d="M6.5 9.5v5M17.5 9.5v5"/>',
    caja: '\x3cpath d="M3 9.5 12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
    users: '\x3ccircle cx="9" cy="8" r="3.2"/>\x3cpath d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>\x3cpath d="M16 5.2a3 3 0 0 1 0 5.6M18 13.8c1.8.6 3 2.3 3 4.7"/>',
    clave: '\x3crect x="4" y="10" width="16" height="10" rx="2"/>\x3cpath d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2.5"/>',
    salir: '\x3cpath d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/>'
  };
  function icono(k) { return '\x3csvg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICO[k] + '\x3c/svg>'; }
  function quien() { return perfil && perfil.nombre ? perfil.nombre : (auth.currentUser ? auth.currentUser.email : ''); }
  function menu(msg) {
    hideApp(); gate.hidden = false; gate.className = ''; window.scrollTo(0, 0);
    var items = [['caja', 'Flujo de caja', 'Disponible, pagos, cobros, bancos y proyección'], ['disp', 'Disponible real en efectivo', 'Lo que hay en bancos y caja menos los pagos autorizados'], ['ventas', 'Ventas e ingresos', 'Ventas por día y por punto, impoconsumo y otros ingresos'], ['egresos', 'Egresos y gastos', 'Todo lo causado por mes, semana o periodo, pagado y sin pagar'], ['pagar', 'Cuentas por pagar', 'Pendientes por proveedor y por semana, pagas y sin pagar'], ['prog', 'Programación de pagos', 'Lo programado para pagar cada semana, con su detalle'], ['auth', 'Pagos autorizados', 'Autorice los pagos de la semana y genere el informe para imprimir'], ['comp', 'Programado vs pagado', 'Lo programado de la semana frente a lo que ya figura pagado y lo que falta'], ['aplic', 'Aplicación de pagos aprobados', 'Contabilidad: marque lo ya pagado y descargue el Excel actualizado']];
    items = items.filter(function (it) { return puedeMod(it[0]) && (it[0] !== 'aplic' || (APLIC_VISIBLE && (esAdmin() || window.MX_ROLE === 'contable'))); });
    if (esAdmin()) items.push(['users', 'Administración de usuarios', 'Crear, editar y eliminar usuarios']);
    items.push(['salir', 'Salir', 'Cerrar sesión y volver al ingreso']);
    gate.innerHTML = '\x3cdiv class="scr scr-menu">\x3cheader class="mh">\x3cdiv class="mh-img" role="img" aria-label="La Matriarca Barranquilla · Tesorería · Control de caja">\x3c/div>\x3c/header>\x3cdiv class="mh-body">\x3cdiv class="scr-in">\x3cdiv class="m-hi">\x3csmall>Bienvenido\x3c/small>\x3cb>' + esc(quien()) + '\x3c/b>\x3cspan>' + esc(ROLES[window.MX_ROLE] || '') + '\x3c/span>\x3c/div>' +
      (msg ? '\x3cp class="g-ok">' + esc(msg) + '\x3c/p>' : '') +
      '\x3cnav class="m-grid">' + items.map(function (it) { return '\x3cbutton class="m-tile' + (it[0] === 'salir' ? ' m-out' : '') + (/^(disp|ventas|egresos|pagar|prog|auth|comp|aplic)$/.test(it[0]) ? ' m-main' : '') + '" data-ir="' + it[0] + '">\x3cspan class="m-ic">' + icono(it[0]) + '\x3c/span>\x3cb>' + it[1] + '\x3c/b>\x3csmall>' + it[2] + '\x3c/small>\x3c/button>'; }).join('') + '\x3c/nav>' +
      (esAdmin() ? '' : '\x3cbutton class="g-link" type="button" data-ir="clave">Cambiar mi contraseña\x3c/button>') +
      '\x3cp class="g-ver">Versión ' + esc(window.MX_VERSION || '') + '\x3c/p>\x3c/div>\x3c/div>\x3c/div>';
    gate.querySelectorAll('[data-ir]').forEach(function (b) { b.onclick = function () { b.dataset.ir === 'salir' ? cerrar() : ir(b.dataset.ir); }; });
  }
  function barra(titulo, sub) { return '\x3cheader class="g-bar">\x3cbutton class="g-back" id="g-back" aria-label="Volver al menú">‹ Menú\x3c/button>\x3cdiv class="g-bt">\x3csmall>' + esc(sub || 'La Matriarca · Tesorería') + '\x3c/small>\x3cb>' + esc(titulo) + '\x3c/b>\x3c/div>\x3cbutton class="g-exit" id="g-exit">Salir\x3c/button>\x3c/header>'; }
  function bindBarra() { $('g-back').onclick = function () { ir('menu'); }; $('g-exit').onclick = cerrar; }
  function cerrar() { marcar(false); auth.signOut().then(function () { history.replaceState(null, '', location.pathname); location.reload(); }); }
  function pintar(v) {
    if (/^(caja|disp|ventas|egresos|pagar|prog|auth|comp|aplic)$/.test(v) && !puedeMod(v)) return menu('No tiene acceso a ese módulo.');
    if (v === 'caja' || v === 'disp' || v === 'ventas' || v === 'egresos' || v === 'pagar' || v === 'prog' || v === 'auth' || v === 'comp' || v === 'aplic') abrirCaja(v);
    else if (v === 'usuarios' && esAdmin()) modUsuarios();
    else if (v === 'clave') { cambiarClave(false, function (m) { ir('menu', m); }); }
    else menu(arguments[1]);
  }
  function ir(v, msg) {
    if (v === 'users') v = 'usuarios';
    if (v === 'menu') { if (history.state && history.state.v && history.state.v !== 'menu') { history.back(); if (msg) setTimeout(function () { menu(msg); }, 60); return; } history.replaceState({ v: 'menu' }, ''); menu(msg); return; }
    history.pushState({ v: v }, '');
    pintar(v);
  }
  window.addEventListener('popstate', function (e) { if (!auth.currentUser || (perfil && perfil.debeCambiar)) return; pintar(e.state && e.state.v || 'menu'); });

  function cargarDatos() {
    show('\x3cp class="g-msg">Cargando datos…\x3c/p>');
    REF.get().then(function (snap) {
      if (snap.exists && snap.data().json) boot(JSON.parse(snap.data().json));
      else primerExcel();
    }).catch(function (er) {
      show('\x3cp class="g-err">' + (er.code === 'permission-denied' ? 'Su usuario no tiene permiso para ver estos datos. Pida al administrador que lo active.' : 'No se pudieron cargar los datos: ' + esc(er.message || er.code)) + '\x3c/p>\x3cbutton class="g-link" type="button" id="g-home">‹ Volver al menú\x3c/button>' + salir()); $('g-home').onclick = function () { ir('menu'); };
      bindSalir();
    });
  }

  function inicio() { history.replaceState({ v: 'menu' }, ''); menu(); }

  show('\x3cp class="g-msg">Cargando…\x3c/p>');
  auth.onAuthStateChanged(function (u) {
    if (u && !abierta) { auth.signOut(); return; } // cada vez que se abre la app pide usuario y contraseña
    if (!u) { if (booted) location.reload(); else loginForm(); return; }
    if (booted) return;
    show('\x3cp class="g-msg">Cargando…\x3c/p>');
    db.collection('usuarios').doc(u.uid).get().then(function (s) {
      perfil = s.exists ? s.data() : null;
      if (u.email === ADMIN_EMAIL) {
        window.MX_ROLE = 'admin';
        if (!perfil) { // primera vez del administrador: le crea el usuario "guillermo"
          perfil = { nombre: 'Guillermo Fontalvo', usuario: 'guillermo', email: u.email, rol: 'admin', activo: true, debeCambiar: false, version: 1 };
          return db.collection('logins').doc('guillermo').get().then(function (l) {
            var b = db.batch();
            b.set(db.collection('usuarios').doc(u.uid), Object.assign({ creado: firebase.firestore.FieldValue.serverTimestamp() }, perfil));
            if (!l.exists) b.set(db.collection('logins').doc('guillermo'), { email: u.email, uid: u.uid });
            return b.commit();
          }).then(inicio, inicio);
        }
        return inicio();
      }
      if (!perfil || !perfil.activo) { show('\x3cp class="g-err">Su usuario está desactivado o no tiene acceso. Hable con el administrador.\x3c/p>' + salir()); bindSalir(); return; }
      window.MX_ROLE = perfil.rol;
      if (perfil.debeCambiar) return cambiarClave(true);
      inicio();
    }).catch(function (er) { show('\x3cp class="g-err">' + esc(errTxt(er)) + '\x3c/p>' + salir()); bindSalir(); });
  });
})();
